<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>จ่ายกลาง — Chest Equipment MSKH</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand.css?v=20261021">
<script src="ui.js?v=20261021"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;-webkit-text-size-adjust:100%}
body{font-family:'Sarabun',sans-serif;background:var(--mist);color:var(--slate);min-height:100vh;display:flex;flex-direction:column}
.header{background:var(--ocean);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.hicon{color:#fff;line-height:0}.htitle{font-size:17px;font-weight:800;color:#fff}.hsub{font-size:12px;color:rgba(255,255,255,.75);flex:1}
.menu-screen{flex:1;padding:24px 16px 40px;max-width:480px;margin:0 auto;width:100%;display:flex;flex-direction:column}
.menu-lbl{font-size:13px;font-weight:800;color:#64748B;text-align:center;margin-bottom:20px;text-transform:uppercase;letter-spacing:.06em}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.menu-card{width:100%;font-family:inherit;background:#fff;border:2px solid var(--border);border-radius:16px;padding:24px 14px;text-align:center;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:8px}
.menu-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.1)}
.menu-card.confirm{border-color:var(--ocean)}.menu-card.confirm:hover{background:var(--air-tint)}
.menu-card.dash{border-color:var(--ocean)}.menu-card.dash:hover{background:var(--air-tint)}
.menu-icon{color:var(--ocean);line-height:0}.menu-name{font-size:15px;font-weight:800;color:var(--slate)}.menu-desc{font-size:12px;color:#64748B;line-height:1.5}
.sub-screen{flex:1;padding:16px 16px 40px;max-width:480px;margin:0 auto;width:100%;display:none;flex-direction:column}
.back-btn{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--ocean);background:none;border:none;cursor:pointer;padding:0;margin-bottom:16px;font-family:'Sarabun',sans-serif}
.card{background:#fff;border-radius:14px;border:1.5px solid var(--border);box-shadow:0 1px 6px rgba(0,0,0,.06);padding:16px;margin-bottom:14px}
.sec{font-size:12px;font-weight:800;color:#64748B;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.equip-item{width:100%;font-family:inherit;font-size:inherit;color:inherit;text-align:left;background:#F8FAFC;border:2px solid #E0E7EF;border-radius:10px;padding:12px 14px;cursor:pointer;transition:.15s;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.equip-item:hover{border-color:var(--ocean);background:var(--air-tint)}
.equip-item.sel{border-color:var(--ocean);background:var(--air-tint)}
.en{font-size:14px;font-weight:700;color:var(--slate)}.es{font-size:12px;color:#64748B;margin-top:2px}
.ebadge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;flex-shrink:0;background:#FEF3C7;color:#92400E}
.sig-form{display:none}.sig-form.show{display:block}
.field{margin-bottom:14px}
.flbl{display:block;font-size:14px;font-weight:700;color:#374151;margin-bottom:7px}
.flbl span{color:#B91C1C}
.fld{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:10px;font-size:15px;font-family:'Sarabun',sans-serif;color:var(--slate);background:#fff;-webkit-appearance:none;appearance:none;transition:border-color .15s}
.fld:focus{border-color:var(--ocean);outline:none}
textarea.fld{resize:vertical;min-height:70px}
.cond-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.cbtn{padding:8px 14px;border:2px solid var(--border);border-radius:8px;font-size:13px;font-weight:700;font-family:'Sarabun',sans-serif;background:#fff;color:#374151;cursor:pointer;transition:.15s}
.cbtn.sel{border-color:var(--ocean);background:var(--ocean);color:#fff}
.divider{height:1px;background:#E5E7EB;margin:14px 0}
.btn-sub{width:100%;padding:15px;background:var(--ocean);color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:800;font-family:'Sarabun',sans-serif;cursor:pointer;transition:.1s}
.btn-sub:disabled{opacity:.45;cursor:not-allowed}
.err{background:#FEE2E2;border-radius:10px;padding:11px 14px;color:#B91C1C;font-size:14px;font-weight:600;margin-bottom:12px;display:none}
.err.show{display:block}
.spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--ocean);border-radius:50%;animation:sp .7s linear infinite;margin:24px auto;display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.kpi{background:#fff;border-radius:12px;border:1px solid #E0E7EF;padding:14px 12px;text-align:center}
.kpi-i{color:var(--ocean);margin-bottom:2px;line-height:0}.kpi-v{font-size:26px;font-weight:800}.kpi-l{font-size:12px;color:#64748B;margin-top:2px}
.eq-card{background:#fff;border-radius:12px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:10px;overflow:hidden}
.eq-hd{padding:11px 14px;background:#F8FAFC;border-bottom:1px solid #E5E7EB;display:flex;align-items:center;justify-content:space-between}
.eq-title{font-size:14px;font-weight:800}
.eq-body{padding:12px 14px}
.ir{display:flex;gap:6px;padding:3px 0;font-size:13px}
.ir-l{color:#64748B;min-width:80px;flex-shrink:0;font-weight:600}.ir-v{color:var(--slate);font-weight:500;flex:1}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:9px}
.badge.w{background:var(--amber-tint);color:var(--amber-text)}.badge.h{background:var(--air-tint);color:var(--ocean)}
.empty{text-align:center;padding:24px;color:#64748B;font-size:14px}
.success-screen{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.sicon{margin-bottom:16px;color:var(--teal);line-height:0}
.stitle{font-size:22px;font-weight:800;color:var(--ocean);margin-bottom:8px}
.ssub{font-size:14px;color:#64748B;line-height:1.7;margin-bottom:24px}
.btn-bk{padding:13px 28px;background:var(--ocean);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:800;font-family:'Sarabun',sans-serif;cursor:pointer}

.en,.es,.menu-name,.menu-desc{display:block}
</style>

</head>
<body>

<div class="header">
  <button type="button" class="hdr-back" onclick="centralBack()" aria-label="ย้อนกลับ"><i data-icon="arrow-left" data-size="22"></i></button>
  <div class="hicon"><i data-icon="hospital" data-size="24"></i></div>
  <div class="hsub">
    <div class="htitle">จ่ายกลาง — Chest Equipment MSKH</div>
    <div style="font-size:12px;color:rgba(255,255,255,.75)">หน่วยโรคระบบการหายใจ · MSKH</div>
  </div>
</div>

<div class="menu-screen" id="menuScreen">
  <div class="menu-lbl">เลือกการดำเนินการ</div>
  <div class="menu-grid">
    <button type="button" class="menu-card confirm" onclick="showConfirm()">
      <span class="menu-icon"><i data-icon="inbox" data-size="40"></i></span>
      <span class="menu-name">ยืนยันรับอุปกรณ์</span>
      <span class="menu-desc">ลงนามยืนยันการส่งมอบจากวอร์ด</span>
    </button>
    <button type="button" class="menu-card dash" onclick="showDash()">
      <span class="menu-icon"><i data-icon="chart" data-size="40"></i></span>
      <span class="menu-name">สถานะอุปกรณ์</span>
      <span class="menu-desc">ดูอุปกรณ์ที่อยู่กับจ่ายกลางขณะนี้</span>
    </button>
  </div>
</div>

<div class="sub-screen" id="confirmScreen">
  <button class="back-btn" onclick="back()">← กลับเมนูหลัก</button>
  <div class="card">
    <div class="sec">เลือกอุปกรณ์ที่รับมอบ</div>
    <div id="eqLoading"><div class="spin"></div></div>
    <div id="eqList" style="display:none"></div>
    <div id="eqEmpty" class="empty" style="display:none">ไม่มีอุปกรณ์รอรับมอบ</div>
  </div>
  <div class="card sig-form" id="sigForm">
    <div class="err" id="formErr"></div>
    <div class="sec">ผู้ส่งมอบจากวอร์ด</div>
    <div class="field">
      <label class="flbl">Ward Worker / Patient Care Aide <span>*</span></label>
      <div id="cdd_sender_wrap"></div>
    </div>
    <div id="senderOtherBox" style="display:none;margin-top:8px">
      <input type="text" class="fld" id="senderOther" placeholder="กรอกชื่อผู้ส่ง">
    </div>
    <div class="divider"></div>
    <div class="sec">ผู้รับมอบจากจ่ายกลาง</div>
    <div class="field">
      <label class="flbl">เจ้าหน้าที่จ่ายกลาง <span>*</span></label>
      <div id="cdd_receiver_wrap"></div>
    </div>
    <div id="receiverOtherBox" style="display:none;margin-top:8px">
      <input type="text" class="fld" id="receiverOther" placeholder="กรอกชื่อผู้รับ">
    </div>
    <div class="divider"></div>
    <div class="field">
      <label class="flbl">สภาพอุปกรณ์ขณะส่งมอบ <span>*</span></label>
      <div class="cond-row">
        <button type="button" class="cbtn" aria-pressed="false" onclick="setCond(this,'สภาพพร้อมใช้งาน (Ready for use)')">สมบูรณ์ดี</button>
        <button type="button" class="cbtn" aria-pressed="false" onclick="setCond(this,'ชำรุดเล็กน้อย (Minor damage)')">ชำรุดเล็กน้อย</button>
        <button type="button" class="cbtn" aria-pressed="false" onclick="setCond(this,'ชำรุดมาก/ใช้งานไม่ได้ (Major damage/Unusable)')">ชำรุดมาก</button>
      </div>
    </div>
    <div class="field">
      <label class="flbl">หมายเหตุ</label>
      <textarea class="fld" id="formNotes" placeholder="รายละเอียดเพิ่มเติม..."></textarea>
    </div>
    <button class="btn-sub" id="submitBtn" onclick="doSubmit()">ยืนยันการรับมอบอุปกรณ์</button>
  </div>
</div>

<div class="sub-screen" id="dashScreen">
  <button class="back-btn" onclick="back()">← กลับเมนูหลัก</button>
  <div class="kpi-row">
    <div class="kpi"><div class="kpi-i"><i data-icon="inbox" data-size="22"></i></div><div class="kpi-v" id="kWait" style="color:#92400E">—</div><div class="kpi-l">รอรับ</div></div>
    <div class="kpi"><div class="kpi-i"><i data-icon="flask" data-size="22"></i></div><div class="kpi-v" id="kHere" style="color:var(--ocean)">—</div><div class="kpi-l">กำลังฆ่าเชื้อ</div></div>
  </div>
  <div class="sec" style="margin-top:0">รอรับจากวอร์ด</div><div id="dWait"><div class="spin"></div></div>
  <div class="sec">อยู่กับจ่ายกลาง</div><div id="dHere"><div class="spin"></div></div>
  <div class="sec">ประวัติล่าสุด</div><div id="dHist"><div class="spin"></div></div>
</div>

<div class="success-screen" id="successScreen">
  <div class="sicon"><i data-icon="check-circle" data-size="68"></i></div>
  <div class="stitle">ยืนยันรับมอบสำเร็จ</div>
  <div class="ssub" id="successSub">บันทึกเรียบร้อยแล้ว<br>ระบบแจ้ง LINE group แล้ว</div>
  <button class="btn-bk" onclick="back()">กลับเมนูหลัก</button>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby-ifmBtOFPgbrnODe6na-5NNGzIt9ae7-qu8X-wLxnp71vOtTihMY5s-Qxg-XvVEKU5w/exec';
let selEquip = null;
let selCond  = '';
let pipe     = null;

function showConfirm() {
  hide('menuScreen'); showFlex('confirmScreen');
  loadEquips(); // loadDropdowns จะถูกเรียกอัตโนมัติเมื่อเลือกอุปกรณ์
}
function showDash() {
  hide('menuScreen'); showFlex('dashScreen');
  loadDash();
}
// ปุ่มย้อนกลับบนหัว: อยู่หน้าย่อย → กลับเมนู, อยู่เมนู → กลับหน้าก่อนหน้า
function centralBack() {
  const inSub = ['confirmScreen','dashScreen','successScreen'].some(function(id){
    const e = document.getElementById(id); return e && e.style.display && e.style.display !== 'none';
  });
  if (inSub) back(); else uiBack({ fallback:'dashboard.html' });
}

function back() {
  ['menuScreen','confirmScreen','dashScreen','successScreen'].forEach(hide);
  showFlex('menuScreen');
  selEquip=null; selCond='';
  const sf=document.getElementById('sigForm'); if(sf) sf.classList.remove('show');
  document.querySelectorAll('.equip-item').forEach(function(e){e.classList.remove('sel');});
  document.querySelectorAll('.cbtn').forEach(function(b){b.classList.remove('sel');});
  document.getElementById('formNotes').value='';
}

async function getPipe(force) {
  if (!force && pipe) return pipe;
  const r = await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},redirect:'follow',
    body:JSON.stringify({source:'central',action:'getCentralPipeline'})});
  const d = await r.json();
  if (d.success) { pipe=d.data; return pipe; }
  throw new Error(d.error||'โหลดข้อมูลไม่ได้');
}

async function loadEquips() {
  show('eqLoading'); hide('eqList'); hide('eqEmpty');
  try {
    pipe=null;
    const d = await getPipe(true);
    const list = d.toReceive||[];
    hide('eqLoading');
    if (!list.length) { show('eqEmpty'); return; }
    const el=document.getElementById('eqList');
    el.style.display='block';
    el.innerHTML=list.map(function(eq){
      const s=eq.steril||{};
      const eid=eq.equipmentSubId.replace(/'/g,''),enm=eq.equipmentName.replace(/'/g,''),
            sb=(s.sentBy||'').replace(/'/g,''),st=(s.sentTime||'').replace(/'/g,''),hw=(eq.homeWard||'').replace(/'/g,'');
      return '<button type="button" class="equip-item" aria-pressed="false" onclick="selEq(this,\''+eid+'\',\''+enm+'\',\''+sb+'\',\''+st+'\',\''+hw+'\')">' +
        '<span><span class="en">'+eq.equipmentSubId+' — '+eq.equipmentName+'</span>' +
        '<span class="es">วอร์ด '+hw+' · ส่งโดย '+(s.sentBy||'-')+' · '+(s.sentTime||'-')+'</span></span>' +
        '<span class="ebadge">รอรับ</span></button>';
    }).join('');
  } catch(e) { hide('eqLoading'); const el=document.getElementById('eqEmpty'); el.textContent=''+e.message; show('eqEmpty'); }
}

function selEq(el,subId,name,sentBy,sentTime,homeWard) {
  document.querySelectorAll('.equip-item').forEach(function(x){x.classList.remove('sel');x.setAttribute('aria-pressed','false');});
  el.classList.add('sel'); el.setAttribute('aria-pressed','true');
  selEquip={subId,name,sentBy,sentTime,homeWard};
  document.getElementById('sigForm').classList.add('show');
  document.getElementById('formErr').classList.remove('show');
  // โหลด dropdown ใหม่โดยกรอง ward ตามอุปกรณ์ที่เลือก
  loadDropdowns(homeWard);
}

async function loadDropdowns(homeWard) {
  // โหลด workers (กรอง ward) และ central staff (จาก sheet Central) แบบ parallel
  const [wr,cr]=await Promise.all([
    fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},redirect:'follow',
      body:JSON.stringify({source:'central',action:'getUsersByRole',role:'worker',ward:homeWard||''})}),
    fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},redirect:'follow',
      body:JSON.stringify({source:'central',action:'getCentralStaff'})}),
  ]);
  const [wd,cd]=await Promise.all([wr.json(),cr.json()]);
  const ss=document.getElementById('senderSel');
  const rs=document.getElementById('receiverSel');

  // ล้างก่อน (กรณีเรียกซ้ำเมื่อเปลี่ยนอุปกรณ์)
  ss.innerHTML='<option value="">— เลือกชื่อผู้ส่ง —</option>';
  rs.innerHTML='<option value="">— เลือกชื่อผู้รับ —</option>';

  // อัปเดต custom dropdowns
  var wOpts=(wd.data||[]).map(function(u){return{value:u.name,label:u.name+(u.ward?' ('+u.ward+')':'')};});
  wOpts.push({value:'__other__',label:'— อื่นๆ (กรอกเอง) —'});
  cddUpdate('senderSel',wOpts,'— เลือกชื่อผู้ส่ง —');
  var cOpts=(cd.data||[]).map(function(n){return{value:n,label:n};});
  cOpts.push({value:'__other__',label:'— อื่นๆ (กรอกเอง) —'});
  cddUpdate('receiverSel',cOpts,'— เลือกชื่อผู้รับ —');
}

function setCond(btn,val) {
  document.querySelectorAll('.cbtn').forEach(function(b){b.classList.remove('sel');b.setAttribute('aria-pressed','false');});
  btn.classList.add('sel'); btn.setAttribute('aria-pressed','true'); selCond=val;
}

async function doSubmit() {
  const errEl=document.getElementById('formErr');
  errEl.classList.remove('show');
  if (!selEquip) { showErr('กรุณาเลือกอุปกรณ์'); return; }
  const senderVal=cddVal('senderSel')==='__other__'?document.getElementById('senderOther').value.trim():cddVal('senderSel');
  const rcvrVal=cddVal('receiverSel')==='__other__'?document.getElementById('receiverOther').value.trim():cddVal('receiverSel');
  if (!senderVal||senderVal==='__other__') { showErr('กรุณาระบุชื่อผู้ส่ง'); return; }
  if (!rcvrVal||rcvrVal==='__other__') { showErr('กรุณาระบุชื่อผู้รับ'); return; }
  if (!selCond) { showErr('กรุณาระบุสภาพอุปกรณ์'); return; }
  const btn=document.getElementById('submitBtn');
  btn.disabled=true; btn.textContent='กำลังบันทึก...';
  try {
    const resp=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},redirect:'follow',
      body:JSON.stringify({source:'central',action:'receive',equipmentSubId:selEquip.subId,
        receivedBy:rcvrVal,sentBy:senderVal,condition:selCond,notes:document.getElementById('formNotes').value.trim()})});
    const result=await resp.json();
    if (result.success) {
      pipe=null; hide('confirmScreen');
      document.getElementById('successSub').innerHTML=''+selEquip.subId+' — '+selEquip.name+'<br>รับโดย: '+rcvrVal+'<br>ส่งโดย: '+senderVal+'<br><br>ระบบแจ้ง LINE group แล้วครับ';
      showFlex('successScreen');
    } else { showErr(result.error||'เกิดข้อผิดพลาด'); btn.disabled=false; btn.textContent='ยืนยันการรับมอบอุปกรณ์'; }
  } catch(e) { showErr('เกิดข้อผิดพลาด: '+e.message); btn.disabled=false; btn.textContent='ยืนยันการรับมอบอุปกรณ์'; }
}

async function loadDash() {
  try {
    const d=await getPipe(true);
    const tr=d.toReceive||[], th=d.toReturn||[], hi=d.history||[];
    document.getElementById('kWait').textContent=tr.length;
    document.getElementById('kHere').textContent=(d.atCentral||[]).length;
    document.getElementById('dWait').innerHTML=!tr.length?'<div class="empty">ไม่มีอุปกรณ์รอรับมอบ</div>':tr.map(function(e){return mkCard(e,'w','รอรับมอบ');}).join('');
    const ac=d.atCentral||[];
    document.getElementById('dHere').innerHTML=!ac.length?'<div class="empty">ไม่มีอุปกรณ์ขณะนี้</div>':ac.map(function(e){return mkCard(e,'h','กำลังฆ่าเชื้อ');}).join('');
    document.getElementById('dHist').innerHTML=!hi.length?'<div class="empty">ยังไม่มีประวัติ</div>':hi.slice(0,10).map(function(h){
      return '<div class="eq-card"><div class="eq-hd"><div class="eq-title">'+h.equipmentSubId+' — '+h.equipmentName+'</div></div>' +
        '<div class="eq-body"><div class="ir"><span class="ir-l">ส่งออก</span><span class="ir-v">'+(h.sentTime||'-')+'</span></div>' +
        '<div class="ir"><span class="ir-l">รับกลับ</span><span class="ir-v">'+(h.unitReceivedTime||'-')+'</span></div>' +
        '<div class="ir"><span class="ir-l">สภาพ</span><span class="ir-v">'+(h.finalCondition||'-')+'</span></div></div></div>';
    }).join('');
  } catch(e) { document.getElementById('dWait').innerHTML='<div class="empty">'+e.message+'</div>'; }
}

function mkCard(eq,bcls,blbl) {
  const s=eq.steril||{};
  return '<div class="eq-card"><div class="eq-hd"><div class="eq-title">'+eq.equipmentSubId+' — '+eq.equipmentName+'</div><span class="badge '+bcls+'">'+blbl+'</span></div>' +
    '<div class="eq-body"><div class="ir"><span class="ir-l">จากวอร์ด</span><span class="ir-v">'+(eq.homeWard||'-')+'</span></div>' +
    (s.sentBy?'<div class="ir"><span class="ir-l">ส่งโดย</span><span class="ir-v">'+s.sentBy+'</span></div>':'') +
    (s.sentTime?'<div class="ir"><span class="ir-l">เวลาส่ง</span><span class="ir-v">'+s.sentTime+'</span></div>':'') +
    (s.centralReceivedBy?'<div class="ir"><span class="ir-l">รับโดย</span><span class="ir-v">'+s.centralReceivedBy+'</span></div>':'') +
    '</div></div>';
}
