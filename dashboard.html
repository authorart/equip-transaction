<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Dashboard — Chest Equipment MSKH</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;-webkit-text-size-adjust:100%}
body{font-family:'Sarabun',sans-serif;background:#F1F5F9;color:#334155;line-height:1.6;min-height:100vh}

/* ── Header ── */
.header{background:linear-gradient(135deg,#0C4A6E,#0C4A6E);padding:14px 16px;
  display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px rgba(0,0,0,.2);
  position:sticky;top:0;z-index:200}
.header-logo{font-size:22px}
.header-info{flex:1}
.header-title{font-size:17px;font-weight:800;color:#fff}
.header-sub{font-size:12px;color:rgba(255,255,255,.75)}
.btn-hdr{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:8px;
  padding:7px 10px;cursor:pointer;font-size:13px;font-family:'Sarabun',sans-serif;font-weight:700}
.btn-hdr:hover{background:rgba(255,255,255,.28)}

/* ── Landing ── */
#landing{padding:32px 16px 60px;max-width:480px;margin:0 auto;text-align:center}
.land-hero{font-size:60px;margin-bottom:12px}
.land-title{font-size:22px;font-weight:800;margin-bottom:6px}
.land-sub{font-size:14px;color:#64748B;margin-bottom:28px}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role-card{background:#fff;border:2px solid #D4DCE8;border-radius:16px;padding:20px 14px;
  text-align:center;cursor:pointer;transition:.15s}
.role-card:hover{border-color:#0C4A6E;transform:translateY(-2px);box-shadow:0 4px 16px rgba(13,115,119,.15)}
.role-card.full{grid-column:1/-1}
.role-icon{font-size:34px;margin-bottom:8px}
.role-name{font-size:15px;font-weight:800}
.role-desc{font-size:12px;color:#64748B;margin-top:3px}

/* ── Tab bar ── */
.tab-bar{display:flex;background:#fff;border-bottom:2px solid #E5E7EB;
  overflow-x:auto;scrollbar-width:none;position:sticky;top:56px;z-index:100}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:11px 14px;font-size:13px;font-weight:700;
  font-family:'Sarabun',sans-serif;color:#64748B;background:none;
  border:none;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab-btn.active{color:#0C4A6E;border-bottom-color:#0C4A6E}

/* ── Views ── */
.view{display:none;padding:16px 16px 70px;max-width:860px;margin:0 auto}
.view.active{display:block}

/* ── Spinner ── */
.spin-box{display:flex;align-items:center;justify-content:center;padding:40px;gap:10px;color:#64748B}
.spinner{width:28px;height:28px;border:3px solid #D4DCE8;border-top-color:#0C4A6E;
  border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Auth ── */
#authBox{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:60vh;gap:12px;color:#64748B;text-align:center;padding:20px}

/* ── KPI ── */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:#fff;border-radius:14px;border:1px solid #E5E7EB;
  padding:14px 12px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.kpi-icon{font-size:24px;margin-bottom:2px}
.kpi-val{font-size:28px;font-weight:800;line-height:1}
.kpi-lbl{font-size:12px;color:#64748B;margin-top:3px}

/* ── Section title ── */
.sec{font-size:13px;font-weight:800;color:#64748B;text-transform:uppercase;
  letter-spacing:.06em;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.sec::after{content:'';flex:1;height:1px;background:#D4DCE8}

/* ── Card ── */
.card{background:#fff;border-radius:14px;border:1px solid #E0E7EF;
  box-shadow:0 1px 6px rgba(0,0,0,.06);margin-bottom:12px;overflow:hidden}
.card-hd{padding:12px 14px;background:#F8FAFC;border-bottom:1px solid #E5E7EB;
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-title{font-size:14px;font-weight:800}
.card-body{padding:14px}

/* ── Equipment grid (public) ── */
.eq-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:500px){.eq-grid{grid-template-columns:repeat(3,1fr)}}
.eq-card{background:#fff;border:2px solid #E0E7EF;border-radius:14px;overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.05)}
.eq-card.avail{border-color:#86EFAC}
.eq-card.busy{border-color:#93C5FD}
.eq-card.other{border-color:#FCA5A5}
.eq-img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#F1F5F9;
  display:flex;align-items:center;justify-content:center;font-size:32px}
.eq-img img{width:100%;height:100%;object-fit:cover}
.eq-body{padding:10px 10px 0}
.eq-name{font-size:13px;font-weight:800;color:#334155;margin-bottom:4px}
.eq-stat{font-size:12px;color:#64748B;margin-bottom:8px}
.eq-stat strong{color:#334155}
.eq-footer{display:flex;flex-direction:column;gap:5px;padding:8px 10px}
.btn-eq{width:100%;padding:9px 8px;border:none;border-radius:9px;font-size:13px;
  font-weight:800;font-family:'Sarabun',sans-serif;cursor:pointer}
.btn-eq.borrow{background:#0C4A6E;color:#fff}
.btn-eq.ret{background:#E0F2FE;color:#0C4A6E;border:1.5px solid #0C4A6E}
.btn-eq.queue{background:#0369A1;color:#fff}

/* ── Badge ── */
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:9px}
.badge.pending{background:#FEF3C7;color:#92400E}
.badge.approved{background:#D1FAE5;color:#065F46}
.badge.rejected,.badge.auto_rejected{background:#FEE2E2;color:#7F1D1D}
.badge.cancelled{background:#F1F5F9;color:#475569}
.badge.in_use{background:#DBEAFE;color:#1E3A8A}
.badge.overdue{background:#FEE2E2;color:#7F1D1D}
.badge.ok{background:#D1FAE5;color:#065F46}
.badge.at_central,.badge.pending_sterilization{background:#CFFAFE;color:#164E63}
.badge.pending_admin_return{background:#EDE9FE;color:#5B21B6}
.badge.available{background:#D1FAE5;color:#065F46}
.badge.warn{background:#FEF3C7;color:#92400E}
.badge.damaged,.badge.repair{background:#FEE2E2;color:#7F1D1D}

/* ── Info row ── */
.ir{display:flex;gap:6px;padding:4px 0;border-bottom:1px solid #F1F5F9;font-size:13px}
.ir:last-child{border:none}
.ir-l{color:#94A3B8;min-width:85px;flex-shrink:0;font-weight:600}
.ir-v{color:#334155;font-weight:500;flex:1;word-break:break-all}

/* ── Action buttons (admin) ── */
.btn{padding:10px 16px;border:none;border-radius:10px;font-size:14px;font-weight:800;
  font-family:'Sarabun',sans-serif;cursor:pointer;transition:.15s}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active{transform:scale(.97)}
.btn.primary{background:#0C4A6E;color:#fff}
.btn.danger{background:#B91C1C;color:#fff}
.btn.secondary{background:#F1F5F9;color:#374151}
.btn.blue{background:#0369A1;color:#fff}
.btn-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn-full{width:100%;padding:13px;border-radius:11px;font-size:15px}

/* ── Timer ── */
.timer{font-size:12px;font-weight:800;padding:3px 9px;border-radius:10px;white-space:nowrap}
.timer.ok{background:#D1FAE5;color:#065F46}
.timer.warn{background:#FEF3C7;color:#92400E}
.timer.urgent{background:#FEE2E2;color:#B91C1C}

/* ── Table ── */
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid #E0E7EF}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:420px}
th{background:#0C4A6E;color:#fff;padding:9px 12px;text-align:left;font-size:12px;font-weight:700}
td{padding:9px 12px;border-bottom:1px solid #F1F5F9;vertical-align:top}
tr:last-child td{border:none}
tr:nth-child(even) td{background:#F8FAFC}

/* ── Date filter ── */
.date-filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.date-filter input{flex:1;min-width:110px;padding:8px 10px;border:2px solid #D4DCE8;
  border-radius:8px;font-size:13px;font-family:'Sarabun',sans-serif}
.date-filter input:focus{border-color:#0C4A6E;outline:none}
.date-filter .btn{padding:8px 14px}

/* ── Empty state ── */
.empty{text-align:center;padding:30px 16px;color:#94A3B8}
.empty .icon{font-size:36px;margin-bottom:8px}

/* ── Pipeline steps ── */
.step{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start}
.step-dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:16px;flex-shrink:0}
.step-dot.s1{background:#FEF3C7}
.step-dot.s2{background:#CFFAFE}
.step-dot.s3{background:#DBEAFE}
.step-body{flex:1}
.step-title{font-size:14px;font-weight:800;color:#334155}
.step-sub{font-size:12px;color:#64748B;line-height:1.7}

/* ── Chart ── */
.chart-wrap{background:#fff;border-radius:14px;border:1px solid #E0E7EF;
  padding:16px;margin-bottom:14px}

/* ── Success overlay ── */
.success-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;
  align-items:center;justify-content:center;padding:20px}
.success-ov.show{display:flex}
.success-box{background:#fff;border-radius:20px;padding:32px 24px;text-align:center;max-width:340px;width:100%}

/* ── Error box ── */
.err-box{background:#FEE2E2;border:1px solid #FECACA;border-radius:10px;
  padding:11px 14px;color:#B91C1C;font-size:13px;margin-bottom:12px;display:none}
.err-box.show{display:block}

/* ── Condition select ── */
.cond-warn{display:none;background:#FEF3C7;border-radius:8px;padding:9px 12px;
  font-size:13px;color:#92400E;font-weight:600;margin-top:6px}
.cond-warn.show{display:block}

/* ── Detail panel (slide-up) ── */
.panel-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300}
.panel-bg.show{display:block}
.panel{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;
  padding:20px 16px 36px;z-index:301;max-height:90vh;overflow-y:auto;max-width:600px;margin:0 auto}
.panel-title{font-size:17px;font-weight:800;margin-bottom:16px;display:flex;justify-content:space-between}
.close-btn{background:none;border:none;font-size:20px;cursor:pointer;color:#64748B}

select.fld,textarea.fld,input.fld{width:100%;padding:11px 13px;border:2px solid #D4DCE8;
  border-radius:10px;font-size:14px;font-family:'Sarabun',sans-serif;color:#334155;background:#fff;
  margin-top:4px;-webkit-appearance:none}
select.fld:focus,textarea.fld:focus,input.fld:focus{border-color:#0C4A6E;outline:none}
textarea.fld{resize:vertical;min-height:70px}
label.lbl{font-size:14px;font-weight:700;color:#374151;display:block;margin-top:12px}

/* ── Print/PDF ── */
@media print{
  .header,.tab-bar,.btn,.btn-row,.date-filter,#landing,.eq-footer{display:none!important}
  .view{display:block!important;padding:0}
  .card,.kpi,.tbl-wrap,.chart-wrap{box-shadow:none;border:1px solid #ccc}
  body{background:#fff}
}
</style>

<style id="cdd-style">
.cdd-wrap{position:relative;width:100%;display:block}
.cdd-btn{width:100%;min-height:46px;padding:11px 36px 11px 14px;
  border:2px solid #D4DCE8;border-radius:10px;font-size:15px;font-family:inherit;
  color:#334155;background:#fff;text-align:left;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  transition:border-color .15s;-webkit-tap-highlight-color:transparent;box-sizing:border-box}
.cdd-btn.placeholder .cdd-txt{color:#9CA3AF}
.cdd-arr{font-size:11px;color:#9CA3AF;flex-shrink:0;transition:transform .2s;margin-left:auto}
.cdd-wrap.open .cdd-arr{transform:rotate(180deg)}
.cdd-list{position:fixed;background:#fff;border:2px solid #0C4A6E;border-radius:10px;
  box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:99999;
  max-height:250px;overflow-y:auto;display:none}
.cdd-wrap.open .cdd-list{display:block}
.cdd-opt{padding:13px 16px;font-size:15px;font-family:inherit;color:#334155;
  cursor:pointer;border-bottom:.5px solid #F3F4F6;-webkit-tap-highlight-color:transparent;user-select:none}
.cdd-opt:last-child{border-bottom:none}
.cdd-opt.cdd-ph{color:#9CA3AF}
.cdd-opt.sel{background:#E0F2FE;color:#0C4A6E;font-weight:600}
</style>

<script id="cdd-lib">
(function(){
var _ow=null;
document.addEventListener('click',function(e){
  if(_ow&&!_ow.contains(e.target)){_ow.classList.remove('open');_ow=null;}
},true);
function pos(wrap){
  var btn=wrap.querySelector('.cdd-btn'),list=wrap.querySelector('.cdd-list');
  var r=btn.getBoundingClientRect();
  list.style.width=Math.max(r.width,180)+'px';
  list.style.left=r.left+'px';
  if(window.innerHeight-r.bottom>160){list.style.top=(r.bottom+2)+'px';list.style.bottom='';}
  else{list.style.bottom=(window.innerHeight-r.top+2)+'px';list.style.top='';}
}
window.makeCDD=function(id,opts,ph,cb){
  var wrap=document.createElement('div');wrap.className='cdd-wrap';wrap.id='cdd_'+id;
  var btn=document.createElement('button');btn.type='button';btn.className='cdd-btn placeholder';
  btn.innerHTML='<span class="cdd-txt">'+ph+'</span><span class="cdd-arr">&#9660;</span>';
  var list=document.createElement('div');list.className='cdd-list';
  var inp=document.createElement('input');inp.type='hidden';inp.id=id;inp.name=id;inp.value='';
  function ao(v,l,p){
    var o=document.createElement('div');o.className='cdd-opt'+(p?' cdd-ph':'');
    o.textContent=l;o.dataset.value=v||'';list.appendChild(o);
  }
  ao('',ph,true);
  (opts||[]).forEach(function(o){ao(typeof o==='string'?o:o.value,typeof o==='string'?o:o.label,false);});
  btn.addEventListener('click',function(e){
    e.preventDefault();e.stopPropagation();
    var op=wrap.classList.contains('open');
    if(_ow&&_ow!==wrap){_ow.classList.remove('open');}
    if(op){wrap.classList.remove('open');_ow=null;}
    else{wrap.classList.add('open');_ow=wrap;pos(wrap);}
  });
  list.addEventListener('click',function(e){
    var o=e.target.closest('.cdd-opt');if(!o)return;
    var v=o.dataset.value||'';inp.value=v;
    btn.querySelector('.cdd-txt').textContent=v?o.textContent:ph;
    btn.classList.toggle('placeholder',!v);
    list.querySelectorAll('.cdd-opt').forEach(function(x){x.classList.remove('sel');});
    o.classList.add('sel');
    wrap.classList.remove('open');_ow=null;
    if(cb)cb(v);
  });
  wrap.appendChild(btn);wrap.appendChild(list);wrap.appendChild(inp);
  return wrap;
};
window.cddUpdate=function(id,opts,ph){
  var wrap=document.getElementById('cdd_'+id);if(!wrap)return;
  var list=wrap.querySelector('.cdd-list'),inp=document.getElementById(id),btn=wrap.querySelector('.cdd-btn');
  list.innerHTML='';
  function ao(v,l,p){var o=document.createElement('div');o.className='cdd-opt'+(p?' cdd-ph':'');o.textContent=l;o.dataset.value=v||'';list.appendChild(o);}
  ao('',ph||'— กรุณาเลือก —',true);
  (opts||[]).forEach(function(o){ao(typeof o==='string'?o:o.value,typeof o==='string'?o:o.label,false);});
  inp.value='';btn.querySelector('.cdd-txt').textContent=ph||'— กรุณาเลือก —';btn.classList.add('placeholder');
};
window.cddSet=function(id,v,l){
  var wrap=document.getElementById('cdd_'+id);if(!wrap)return;
  var inp=document.getElementById(id),btn=wrap.querySelector('.cdd-btn'),list=wrap.querySelector('.cdd-list');
  inp.value=v||'';btn.querySelector('.cdd-txt').textContent=(v&&l)?l:(v||btn.querySelector('.cdd-txt').textContent);
  btn.classList.toggle('placeholder',!v);
  list.querySelectorAll('.cdd-opt').forEach(function(o){o.classList.toggle('sel',o.dataset.value===v);});
};
window.cddVal=function(id){var e=document.getElementById(id);return e?e.value:'';};
})();
</script>
<style id="v7-style">
/* ═══ v7 — Visual Brand Direction: "Sustaining Life, Syncing Assets" ═══
   Deep Ocean #0C4A6E · Air Blue #0EA5E9 · Fresh Air Green #F0FDF4 · Clinical Teal #3F6C5E
   Caution Amber #F59E0B · Crisis Red #EF4444 · Clinical Slate #F1F5F9 · Deep Slate #334155 */
:root{--ocean:#0C4A6E;--air:#0EA5E9;--fresh:#F0FDF4;--teal:#3F6C5E;--amber:#F59E0B;--red:#EF4444;
  --mist:#F1F5F9;--slate:#334155;--line:#E2E8F0;--muted:#64748B}
html{font-size:14px}
body{font-size:14px;background:linear-gradient(180deg,#EAF4FA 0,#F1F5F9 260px);background-attachment:fixed;color:var(--slate)}
.header{background:var(--ocean);box-shadow:0 2px 12px rgba(12,74,110,.25);height:60px;padding:0 16px}
.header-logo{font-size:26px}
.header-title{font-size:16px;font-weight:700}
.header-sub{font-size:12px;color:#BAE6FD}
.tab-bar{top:60px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 6px rgba(12,74,110,.06);padding:0 8px}
.tab-bar.sub{position:static;background:var(--mist);box-shadow:none}
.tab-btn{font-size:14px;padding:13px 14px;color:var(--muted)}
.tab-btn.active{color:var(--ocean);border-bottom-color:var(--air)}
.tab-btn .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;line-height:20px;text-align:center}
.view{max-width:980px}
.page-title{font-size:24px;font-weight:800;color:var(--ocean);line-height:1.3;margin:4px 0 2px}
.page-sub{font-size:14px;color:var(--muted);margin-bottom:14px}
.sec{font-size:18px;font-weight:800;color:var(--ocean);text-transform:none;letter-spacing:0;margin:22px 0 10px}
.sec::after{background:var(--line)}
.kpi{border-radius:16px;border:1px solid var(--line);box-shadow:0 1px 4px rgba(12,74,110,.06);padding:14px 12px;text-align:left}
.kpi-ic{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.kpi-val{font-size:40px;font-weight:800;line-height:1.1;margin-top:4px}
.kpi-lbl{font-size:13px;color:var(--muted);margin-top:2px}
.kpi-row{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.cc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 14px 10px;box-shadow:0 1px 4px rgba(12,74,110,.05)}
.cc-t{font-size:14px;font-weight:800;color:var(--ocean)}
.cc-s{font-size:12px;color:var(--muted);margin-bottom:6px}
.cbox{position:relative;width:100%}
.grid2{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
th{background:var(--ocean)}
.tbl-wrap{border-color:var(--line);background:#fff}
tr:nth-child(even) td{background:var(--mist)}
.card,.chart-wrap{border-color:var(--line)}
.btn.primary,.btn-eq.borrow{background:var(--ocean)}
.btn-eq.ret{background:#E0F2FE;color:var(--ocean);border-color:var(--ocean)}
.eq-card{border-radius:16px}
.eq-card.avail{border-color:var(--teal)}
.eq-card.busy{border-color:var(--amber)}
.eq-card.other{border-color:var(--red)}
.eq-name{font-size:14px}
/* status badges follow the brand status icons */
.badge{font-size:12px}
.badge.available{background:var(--fresh);color:var(--teal);box-shadow:inset 0 0 0 1px #BBD5C8}
.badge.in_use{background:#FEF3C7;color:#92400E}
.badge.damaged,.badge.repair{background:#FEE2E2;color:#B91C1C}
.badge.lost{background:#E2E8F0;color:var(--slate)}
.badge.disposed{background:#E2E8F0;color:var(--slate)}
.badge.pending_approval,.badge.pending_admin_return,.badge.pending_sterilization,.badge.at_central{background:#E0F2FE;color:var(--ocean)}
/* filters */
.fbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:#fff;border:1px solid var(--line);
  border-radius:16px;padding:12px 14px;margin-bottom:14px}
.fgrp{display:flex;flex-direction:column;gap:4px;min-width:130px}
.fgrp>label{font-size:12px;font-weight:700;color:var(--muted)}
.fbar select,.fbar input{padding:9px 10px;border:1.5px solid #CBD5E1;border-radius:10px;font-size:14px;
  font-family:inherit;color:var(--slate);background:#fff;min-height:40px}
.fbar select:focus,.fbar input:focus{border-color:var(--air);outline:none}
.seg{display:inline-flex;border:1.5px solid #CBD5E1;border-radius:10px;overflow:hidden}
.seg button{border:none;background:#fff;padding:9px 14px;font-size:14px;font-family:inherit;font-weight:700;
  color:var(--muted);cursor:pointer;min-height:40px}
.seg button+button{border-left:1.5px solid #CBD5E1}
.seg button.on{background:var(--ocean);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1.5px solid #CBD5E1;background:#fff;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;
  font-family:inherit;color:var(--slate);cursor:pointer}
.chip.on{background:var(--ocean);border-color:var(--ocean);color:#fff}
.legend-note{font-size:12px;color:var(--muted);margin-top:6px}
.alert-strip{display:flex;gap:10px;align-items:center;background:#FEF2F2;border:1px solid #FECACA;border-radius:14px;
  padding:10px 14px;margin-bottom:14px;cursor:pointer;font-weight:700;color:#B91C1C}
.ok-strip{display:flex;gap:10px;align-items:center;background:var(--fresh);border:1px solid #BBD5C8;border-radius:14px;
  padding:10px 14px;margin-bottom:14px;font-weight:700;color:var(--teal)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:800;background:#E0F2FE!important;border-top:2px solid var(--ocean)}
@media print{.tab-bar,.fbar,.header{display:none!important}}
</style>
</head>
<body>

<div class="header" id="mainHeader" style="display:none">
  <div class="header-logo">🫁</div>
  <div class="header-info">
    <div class="header-title">ระบบจัดการอุปกรณ์หน่วยโรคระบบหายใจ</div>
    <div class="header-sub" id="headerSub">Sustaining Life, Syncing Assets · MSKH</div>
  </div>
  <button class="btn-hdr" id="btnLogin" onclick="doLogin()" style="display:none;margin-right:4px">🔑 เจ้าหน้าที่</button>
  <button class="btn-hdr" onclick="refreshData()" title="รีเฟรชข้อมูล">🔄</button>
</div>

<div id="authBox"><div class="spinner"></div><div>กำลังเชื่อมต่อ...</div></div>
<div class="tab-bar" id="tabBar" style="display:none"></div>
<div class="tab-bar sub" id="subTabBar" style="display:none"></div>

<!-- ═══ PUBLIC VIEW (ทุกคนดูได้ ไม่ต้อง login) ═══════════ -->
<div class="view" id="view-public">
  <div id="pane-status" class="pane"></div>
  <div id="pane-problem" class="pane" style="display:none"></div>
  <div id="pane-usage" class="pane" style="display:none"></div>
</div>

<!-- ═══ ADMIN VIEW ═══════════════════════════════════ -->
<div class="view" id="view-admin">
  <div id="adm-pending" class="adm-tab"></div>
  <div id="adm-return"  class="adm-tab" style="display:none"></div>
  <div id="adm-steril"  class="adm-tab" style="display:none"></div>
  <div id="adm-rcv"     class="adm-tab" style="display:none"></div>
  <div id="adm-status"  class="adm-tab" style="display:none"></div>
  <div id="adm-report"  class="adm-tab" style="display:none">
    <div class="sec">📊 ส่งออกรายงาน</div>
    <div class="card"><div class="card-body">
      <div class="date-filter">
        <input type="date" id="rptFrom">
        <input type="date" id="rptTo">
        <button class="btn primary" onclick="loadReport()">ดูรายงาน</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
        <button class="btn secondary" onclick="setRange(7)">7 วัน</button>
        <button class="btn secondary" onclick="setRange(30)">30 วัน</button>
        <button class="btn secondary" onclick="setRange(90)">3 เดือน</button>
        <button class="btn secondary" onclick="setRange(365)">1 ปี</button>
        <button class="btn primary" onclick="printReport()">🖨️ พิมพ์ / PDF</button>
      </div>
      <div id="rpt-content"><div class="empty"><div class="icon">📋</div>เลือกช่วงเวลาแล้วกด "ดูรายงาน"</div></div>
    </div></div>
  </div>
</div>

<!-- ═══ CENTRAL VIEW ═════════════════════════════════ -->
<div class="view" id="view-central">
  <div id="cen-receive" class="cen-tab"></div>
  <div id="cen-return"  class="cen-tab" style="display:none"></div>
  <div id="cen-report"  class="cen-tab" style="display:none">
    <div class="sec">📊 สรุปรายงานจ่ายกลาง</div>
    <div id="cen-rpt-content"><div class="spin-box"><div class="spinner"></div>กำลังโหลด...</div></div>
  </div>
</div>

<!-- ═══ SUPERADMIN VIEW ══════════════════════════════ -->
<div class="view" id="view-super">
  <div id="sup-content"><div class="spin-box"><div class="spinner"></div>กำลังโหลด...</div></div>
</div>

<!-- ── Detail Panel (bottom sheet) ── -->
<div class="panel-bg" id="panelBg" onclick="closePanel()"></div>
<div class="panel" id="detailPanel" style="display:none">
  <div class="panel-title"><span id="panelTitle">รายละเอียด</span><button class="close-btn" onclick="closePanel()">✕</button></div>
  <div id="panelBody"></div>
</div>

<!-- ── Success overlay ── -->
<div class="success-ov" id="successOv">
  <div class="success-box">
    <div style="font-size:56px;margin-bottom:12px" id="successIcon">✅</div>
    <div style="font-size:20px;font-weight:800;color:#0C4A6E;margin-bottom:8px" id="successTitle">สำเร็จ</div>
    <div style="font-size:14px;color:#64748B;margin-bottom:20px" id="successSub"></div>
    <button class="btn primary btn-full" onclick="hideSuccess()">เรียบร้อย</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
const LIFF_ID    = '2009365358-XIHw2A0N';
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby-ifmBtOFPgbrnODe6na-5NNGzIt9ae7-qu8X-wLxnp71vOtTihMY5s-Qxg-XvVEKU5w/exec';
const FORM_URL   = 'https://authorart.github.io/equip-transaction/form.html';

let userId     = '';
let userAuth   = null;
let curView    = 'public';   // public | admin | central | super
let curSection = 'status';   // status | problem | usage | admin | central | super
let curAdmTab  = 'pending';
let curCenTab  = 'receive';
let admData    = null; // cached admin data
let pubData    = null; // cached public data
let cenData    = null; // cached central pipeline
let usageData  = null; // cached usage events

// ── Brand tokens (chest-equip-vbd.jpeg) ─────────────
const C = { ocean:'#0C4A6E', air:'#0EA5E9', fresh:'#F0FDF4', teal:'#3F6C5E', amber:'#F59E0B',
            red:'#EF4444', mist:'#F1F5F9', slate:'#334155', muted:'#64748B', line:'#E2E8F0' };
const MONTH_TH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

// กลุ่มสถานะ → สี (ใช้ซ้ำทุกกราฟ สีผูกกับกลุ่มเสมอ ไม่เปลี่ยนตามลำดับ)
const GROUPS = [
  { key:'available', label:'พร้อมใช้งาน',          color:C.teal,  sts:['available'] },
  { key:'in_use',    label:'กำลังใช้งาน',           color:C.amber, sts:['in_use'] },
  { key:'process',   label:'อยู่ระหว่างดำเนินการ',  color:C.air,   sts:['pending_approval','pending_admin_return','pending_sterilization','at_central'] },
  { key:'problem',   label:'ชำรุด/ซ่อม/สูญหาย',     color:C.red,   sts:['damaged','repair','lost'] },
  { key:'disposed',  label:'จำหน่าย',               color:C.slate, sts:['disposed'] },
];
function groupOf(st) { return GROUPS.find(g => g.sts.includes(st)) || GROUPS[2]; }

const STATUS_TH = {
  available:'พร้อมใช้งาน', pending_approval:'รออนุมัติ', in_use:'กำลังถูกยืม',
  pending_admin_return:'รอรับคืน', pending_sterilization:'รอฆ่าเชื้อ', at_central:'จ่ายกลาง',
  damaged:'ชำรุด', repair:'ส่งซ่อม', disposed:'จำหน่าย', lost:'สูญหาย'
};
const PROBLEM_ST = ['damaged','repair','lost'];
const PROBLEM_COLOR = { damaged:'#EF4444', repair:'#991B1B', lost:'#334155' };

// ═══════════════════════════════════════════════════
//  INIT — ไม่มีหน้าเลือกบทบาท เข้า dashboard ได้ทันที
// ═══════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async function() {
  const today = new Date(), d30 = new Date(Date.now()-30*86400000);
  const f = document.getElementById('rptFrom'), t = document.getElementById('rptTo');
  if (f) f.value = isoDate(d30);
  if (t) t.value = isoDate(today);

  if (window.Chart) {
    Chart.defaults.font.family = "'Sarabun',sans-serif";
    Chart.defaults.font.size   = 13;
    Chart.defaults.color       = C.slate;
    Chart.defaults.borderColor = C.line;
  }

  try {
    await liff.init({ liffId: LIFF_ID });
    if (liff.isLoggedIn()) {
      const profile = await liff.getProfile();
      userId        = profile.userId;
      const r  = await post({ source:'dashboard', action:'checkAuth', userId });
      userAuth = r.success ? r : null;
    }
  } catch(e) { /* visitor mode — ดูข้อมูลสาธารณะได้ตามปกติ */ }

  document.getElementById('authBox').style.display    = 'none';
  document.getElementById('mainHeader').style.display = 'flex';
  document.getElementById('btnLogin').style.display   = (!userAuth && window.liff && !liff.isLoggedIn()) ? '' : 'none';
  if (userAuth) document.getElementById('headerSub').textContent =
    userAuth.name + ' · ' + (userAuth.role==='superadmin'?'Superadmin':userAuth.role==='admin'?'Admin '+userAuth.ward:'จ่ายกลาง');
  buildMainTabs();
  goSection('status');
  ensurePub().then(updateProblemBadge).catch(function(){});
});

function doLogin() { try { liff.login({ redirectUri: location.href }); } catch(e) {} }

// ═══════════════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════════════
const PUBLIC_SECTIONS = ['status','problem','usage'];

function mainTabs() {
  const t = [['status','สถานะอุปกรณ์'],['problem','ชำรุด / ซ่อม / สูญหาย'],['usage','การใช้งานอุปกรณ์']];
  if (userAuth) {
    if (userAuth.role==='admin'||userAuth.role==='superadmin') t.push(['admin','🔑 จัดการ (Admin)']);
    if (userAuth.role==='central'||userAuth.role==='superadmin') t.push(['central','🏥 จ่ายกลาง']);
    if (userAuth.role==='superadmin') t.push(['super','🛡️ ภาพรวม']);
  }
  return t;
}

function buildMainTabs() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = mainTabs().map(([id,lbl]) =>
    `<button class="tab-btn" id="tab-${id}" onclick="goSection('${id}')">${lbl}${id==='problem'?'<span class="cnt" id="problemCnt" style="display:none"></span>':''}</button>`
  ).join('');
  show('tabBar');
}

function updateProblemBadge() {
  const el = document.getElementById('problemCnt');
  if (!el || !pubData) return;
  const n = allUnits(pubData).filter(u => PROBLEM_ST.includes(u.status)).length;
  el.textContent = n; el.style.display = n ? '' : 'none';
}

function goSection(sec) {
  curSection = sec;
  ['public','admin','central','super'].forEach(v => hide('view-'+v));
  document.querySelectorAll('#tabBar .tab-btn').forEach(b => b.classList.toggle('active', b.id === 'tab-'+sec));

  if (PUBLIC_SECTIONS.includes(sec)) {
    curView = 'public';
    hide('subTabBar'); show('view-public');
    PUBLIC_SECTIONS.forEach(p => { document.getElementById('pane-'+p).style.display = (p===sec) ? 'block' : 'none'; });
    loadPane(sec);
    return;
  }
  curView = sec;
  show('view-'+sec);
  if (sec==='admin')        { buildSubTabs('admin');   curAdmTab='pending'; switchAdmTab('pending'); }
  else if (sec==='central') { buildSubTabs('central'); curCenTab='receive'; switchCenTab('receive'); }
  else if (sec==='super')   { hide('subTabBar'); loadSuperView(); }
}

const TABS = {
  admin  : [['pending','⏳ รออนุมัติ'],['return','↩️ รอรับคืน'],['steril','🧪 รอส่งจ่ายกลาง'],['rcv','📦 รอรับกลับ'],['status','🔧 สถานะอุปกรณ์'],['report','📊 รายงาน']],
  central: [['receive','📥 รับจากวอร์ด'],['return','📤 ส่งคืนวอร์ด'],['report','📊 รายงาน']],
};

function buildSubTabs(role) {
  const bar = document.getElementById('subTabBar');
  bar.innerHTML = (TABS[role]||[]).map(([id,lbl],i) =>
    `<button class="tab-btn${i?'':' active'}" id="stab-${id}" onclick="onTab('${id}','${role}')">${lbl}</button>`
  ).join('');
  show('subTabBar');
}

function onTab(id, role) {
  document.querySelectorAll('#subTabBar .tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('stab-'+id).classList.add('active');
  if (role==='admin')        switchAdmTab(id);
  else if (role==='central') switchCenTab(id);
}

function refreshData() {
  admData=null; pubData=null; cenData=null; usageData=null;
  goSection(curSection);
  if (curView !== 'public') return;
  ensurePub().then(updateProblemBadge).catch(function(){});
}

// ═══════════════════════════════════════════════════
//  API
// ═══════════════════════════════════════════════════
async function post(payload) {
  const r = await fetch(SCRIPT_URL, {
    method:'POST', headers:{'Content-Type':'text/plain'},
    redirect:'follow', body: JSON.stringify(payload),
  });
  return r.json();
}

async function get(action, params) {
  return post(Object.assign({ source:'dashboard', action, userId }, params||{}));
}

async function ensurePub() {
  if (pubData) return pubData;
  const r = await get('getDashboardPublic');
  if (!r.success) throw new Error(r.error);
  pubData = r.data; return pubData;
}

async function ensureUsage() {
  if (usageData) return usageData;
  const r = await get('getUsageData');
  if (!r.success) throw new Error(r.error || 'ยังไม่รองรับ getUsageData — ต้อง deploy Apps Script v7 ก่อน');
  usageData = r.data; return usageData;
}

async function loadPane(sec) {
  const id = 'pane-' + sec;
  try {
    if (sec === 'usage') {
      if (!pubData || !usageData) setContent(id, spinHTML());
      await Promise.all([ensurePub(), ensureUsage()]);
      initUsage(); renderUsage();
    } else {
      if (!pubData) setContent(id, spinHTML());
      await ensurePub();
      if (sec === 'status') renderStatus(pubData); else renderProblem(pubData);
      updateProblemBadge();
    }
  } catch(e) { setContent(id, errHTML(esc(e.message))); }
}

// ═══════════════════════════════════════════════════
//  CHART HELPERS
// ═══════════════════════════════════════════════════
const charts = {};
function mkChart(id, cfg) {
  const el = document.getElementById(id);
  if (!el || !window.Chart) return;
  if (charts[id]) charts[id].destroy();
  cfg.options = cfg.options || {};
  cfg.options.responsive = true;
  cfg.options.maintainAspectRatio = false;
  charts[id] = new Chart(el, cfg);
}
function chartBox(id, h, label) {
  return `<div class="cbox" style="height:${h}px"><canvas id="${id}" role="img" aria-label="${esc(label)}"></canvas></div>`;
}
function barH(n) { return Math.max(170, n * 40 + 70); }

// ตัวเลขกลางโดนัท
const centerText = { id:'centerText', afterDraw(ch, _a, o) {
  if (!o || o.text == null) return;
  const a = ch.chartArea, ctx = ch.ctx, cx = (a.left+a.right)/2, cy = (a.top+a.bottom)/2;
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = C.ocean; ctx.font = "800 34px Sarabun"; ctx.fillText(o.text, cx, cy-8);
  ctx.fillStyle = C.muted; ctx.font = "500 13px Sarabun"; ctx.fillText(o.sub||'', cx, cy+16);
  ctx.restore();
}};
// ค่าที่ปลายแท่งแนวนอน (label ตรง ๆ ใช้สีตัวอักษร ไม่ใช้สีซีรีส์)
const barValueLabels = { id:'barValueLabels', afterDatasetsDraw(ch, _a, o) {
  const suffix = (o && o.suffix) || '', ctx = ch.ctx;
  ctx.save(); ctx.fillStyle = C.slate; ctx.font = '700 13px Sarabun';
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ch.getDatasetMeta(0).data.forEach(function(b, i) {
    ctx.fillText(ch.data.datasets[0].data[i] + suffix, b.x + 6, b.y);
  });
  ctx.restore();
}};

// ไอคอนสถานะตาม VBD: พร้อมใช้งาน ✓ / กำลังใช้งาน 🔒 / ส่งซ่อม ✕
function statusIcon(kind, size) {
  const s = size || 22, col = kind==='available'?C.teal:kind==='in_use'?C.amber:kind==='problem'?C.red:kind==='process'?C.air:C.ocean;
  const inner = kind==='available' ? '<path d="M7 12.5l3.2 3.2L17 9" />'
    : kind==='in_use' ? '<rect x="8" y="11" width="8" height="6" rx="1.2"/><path d="M9.5 11V9.5a2.5 2.5 0 015 0V11"/>'
    : kind==='problem' ? '<path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/>'
    : kind==='process' ? '<path d="M12 7.5V12l3 2"/>'
    : '<path d="M8 15V12m4 3V9m4 6v-4"/>';
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/>${inner}</svg>`;
}
function kpiCard(kind, label, val, color, extra) {
  return `<div class="kpi"><div class="kpi-ic">${statusIcon(kind,20)}${esc(label)}</div>
    <div class="kpi-val" style="color:${color}">${val}</div>${extra?`<div class="kpi-lbl">${extra}</div>`:''}</div>`;
}

// ═══════════════════════════════════════════════════
//  COMMON FORMATTERS
// ═══════════════════════════════════════════════════
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDT(iso) {
  if (!iso) return '-';
  try { return new Date(iso).toLocaleString('th-TH',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}); }
  catch(e) { return '-'; }
}
function fmtDay(iso) {
  if (!iso) return '-';
  try { return new Date(iso).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}); }
  catch(e) { return '-'; }
}
function stBadge(st) { return `<span class="badge ${esc(st)}">${esc(STATUS_TH[st]||st)}</span>`; }
function daysTxt(n) { return (n == null) ? '-' : (n === 0 ? 'วันนี้' : n + ' วัน'); }

function allUnits(d) {
  const out = [];
  (d.equipment||[]).forEach(eq => eq.units.forEach(u =>
    out.push(Object.assign({ name: eq.equipmentName, equipmentId: eq.equipmentId, homeWard: eq.homeWard }, u))));
  return out;
}
function whereOf(u) {
  return (u.status === 'in_use' || u.status === 'pending_admin_return')
    ? (u.ward || u.location) + (u.expectedReturn ? ' (คืน ' + u.expectedReturn + ')' : '')
    : (u.location || u.homeWard);
}

// ═══════════════════════════════════════════════════
//  เมนู 1 — สถานะอุปกรณ์
// ═══════════════════════════════════════════════════
function renderStatus(d) {
  try {
    const units = allUnits(d), total = units.length;
    const gc = {}; GROUPS.forEach(g => gc[g.key] = 0);
    units.forEach(u => gc[groupOf(u.status).key]++);
    const queueN = (d.queueData||[]).length;

    let h = `<h1 class="page-title">สถานะอุปกรณ์</h1>
      <div class="page-sub">ภาพรวมอุปกรณ์ทั้งหมดของหน่วยโรคระบบหายใจ ณ ปัจจุบัน</div>
      <div class="kpi-row">
        ${kpiCard('all','อุปกรณ์ทั้งหมด',total,C.ocean,'ชิ้น')}
        ${kpiCard('available','พร้อมใช้งาน',gc.available,C.teal,'ชิ้น')}
        ${kpiCard('in_use','กำลังใช้งาน',gc.in_use,'#B45309','ชิ้น')}
        ${kpiCard('process','รอดำเนินการ',gc.process,C.ocean,'อนุมัติ/รับคืน/จ่ายกลาง')}
        ${kpiCard('problem','ชำรุด/ซ่อม/สูญหาย',gc.problem,C.red,'ชิ้น')}
      </div>`;

    h += gc.problem > 0
      ? `<div class="alert-strip" onclick="goSection('problem')">${statusIcon('problem',22)}มีอุปกรณ์ชำรุด/ส่งซ่อม/สูญหาย ${gc.problem} ชิ้น — กดเพื่อดูรายละเอียด →</div>`
      : `<div class="ok-strip">${statusIcon('available',22)}ไม่มีอุปกรณ์ชำรุด/ส่งซ่อม/สูญหาย</div>`;

    h += `<div class="grid2">
      <div class="cc"><div class="cc-t">สัดส่วนสถานะอุปกรณ์</div><div class="cc-s">จำนวนชิ้นแยกตามสถานะ</div>
        ${chartBox('chStatusDonut',260,'กราฟโดนัทสัดส่วนสถานะอุปกรณ์')}</div>
      <div class="cc"><div class="cc-t">สถานะแยกตามชนิดอุปกรณ์</div><div class="cc-s">จำนวนชิ้นของแต่ละชนิด</div>
        ${chartBox('chStatusByType',barH((d.equipment||[]).length),'กราฟแท่งสถานะแยกตามชนิดอุปกรณ์')}</div>
    </div>`;

    h += '<div class="sec">อุปกรณ์แต่ละชนิด</div><div class="eq-grid">';
    (d.equipment||[]).forEach(function(eq) {
      const avail  = eq.units.filter(u=>u.status==='available').length;
      const inUse  = eq.units.filter(u=>u.status==='in_use');
      const hasAvail = avail>0;
      const cardCls = hasAvail?'avail':inUse.length>0?'busy':'other';
      const imgHtml = eq.imageId
        ? '<img src="https://drive.google.com/thumbnail?id=' + encodeURIComponent(eq.imageId) + '&sz=w400" alt="" style="width:100%;height:100%;object-fit:cover">'
        : '<span style="font-size:32px">📦</span>';
      let btns = '';
      if (hasAvail) btns += `<button class="btn-eq borrow" onclick="window.open('${FORM_URL}?type=borrow&equipmentId=${encodeURIComponent(eq.equipmentId)}','_blank')">📋 ยืม</button>`;
      if (inUse.length > 0) {
        const retUri = inUse.length===1
          ? `${FORM_URL}?type=return&equipmentId=${encodeURIComponent(eq.equipmentId)}&subId=${encodeURIComponent(inUse[0].subId)}`
          : `${FORM_URL}?type=return&equipmentId=${encodeURIComponent(eq.equipmentId)}`;
        btns += `<button class="btn-eq ret" onclick="window.open('${retUri}','_blank')">↩️ คืน</button>`;
      }
      if (!hasAvail) btns += `<button class="btn-eq queue" onclick="alert('กรุณาจองคิวผ่าน LINE OA ครับ')">⏳ จองคิว</button>`;
      const parts = [];
      if (avail>0) parts.push(`ว่าง ${avail}`);
      if (inUse.length>0) parts.push(`ยืม ${inUse.length}`);
      const other = eq.units.length - avail - inUse.length;
      if (other>0) parts.push(`อื่นๆ ${other}`);
      h += `<div class="eq-card ${cardCls}">
        <div class="eq-img">${imgHtml}</div>
        <div class="eq-body"><div class="eq-name">${esc(eq.equipmentName)}</div>
          <div class="eq-stat">${parts.join(' · ')} · <strong>${esc(eq.homeWard)}</strong></div></div>
        <div class="eq-footer">${btns}</div></div>`;
    });
    h += '</div>' + renderUnitTable(d);

    if (queueN > 0) {
      h += '<div class="sec">คิวรออยู่</div><div class="tbl-wrap"><table><tr><th>#</th><th>อุปกรณ์</th><th>ชื่อ</th><th>สถานะ</th></tr>';
      d.queueData.forEach(q => {
        h += `<tr><td>${esc(q.queuePos)}</td><td>${esc(q.equipmentId)}</td><td>${esc(q.name)}</td>
          <td><span class="badge ${q.status==='notified'?'in_use':'pending_approval'}">${q.status==='notified'?'แจ้งแล้ว':'รออยู่'}</span></td></tr>`;
      });
      h += '</table></div>';
    }
    h += `<div style="font-size:12px;color:#94A3B8;text-align:center;margin-top:14px">อัปเดต: ${fmtTime(d.lastUpdated)}</div>`;
    setContent('pane-status', h);

    // โดนัท
    const act = GROUPS.filter(g => gc[g.key] > 0);
    mkChart('chStatusDonut', {
      type:'doughnut', plugins:[centerText],
      data:{ labels: act.map(g => g.label + ' (' + gc[g.key] + ')'),
             datasets:[{ data: act.map(g => gc[g.key]), backgroundColor: act.map(g => g.color), borderColor:'#fff', borderWidth:2 }] },
      options:{ cutout:'64%', plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12, padding:12 } },
        centerText:{ text: total, sub:'ชิ้น' },
        tooltip:{ callbacks:{ label: c => ` ${c.label.replace(/ \(\d+\)$/,'')}: ${c.parsed} ชิ้น (${total?Math.round(c.parsed/total*100):0}%)` } } } }
    });
    // แท่งซ้อนตามชนิด
    const eqs = d.equipment||[];
    const sg = GROUPS.filter(g => eqs.some(eq => eq.units.some(u => groupOf(u.status).key === g.key)));
    mkChart('chStatusByType', {
      type:'bar',
      data:{ labels: eqs.map(e => e.equipmentName),
        datasets: sg.map(g => ({ label:g.label, backgroundColor:g.color, borderColor:'#fff', borderWidth:2,
          data: eqs.map(e => e.units.filter(u => groupOf(u.status).key === g.key).length) })) },
      options:{ indexAxis:'y',
        scales:{ x:{ stacked:true, ticks:{ precision:0, stepSize:1 }, grid:{ color:C.line } }, y:{ stacked:true, grid:{ display:false } } },
        plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12, padding:12 } } } }
    });
  } catch(err) {
    console.error('renderStatus error:', err);
    setContent('pane-status', errHTML('Render error: ' + esc(err.message)));
  }
}

// ตารางรายเครื่อง ค้นหา/กรองสถานะได้ กดดูประวัติ
function renderUnitTable(d) {
  const units = allUnits(d);
  let h = '<div class="sec">รายเครื่อง <span style="font-size:13px;font-weight:600;color:var(--muted)">(กดที่แถวเพื่อดูประวัติ)</span></div>' +
    '<div class="fbar" style="padding:10px 12px"><div class="fgrp" style="flex:1;min-width:180px">' +
    '<input id="unitSearch" oninput="filterUnits()" placeholder="🔍 ค้นหา รหัส / ชื่อ / ที่อยู่"></div>' +
    '<div class="fgrp"><select id="unitStatus" onchange="filterUnits()">' +
    '<option value="">ทุกสถานะ</option>' +
    Object.keys(STATUS_TH).map(k => `<option value="${k}">${STATUS_TH[k]}</option>`).join('') +
    '</select></div></div>' +
    '<div class="tbl-wrap"><table id="unitTable"><tr><th>เครื่อง</th><th>สถานะ</th><th>ที่อยู่</th><th>นาน</th></tr>';
  units.forEach(u => {
    const where = whereOf(u);
    const hay = (u.subId + ' ' + u.name + ' ' + where + ' ' + (STATUS_TH[u.status]||'')).toLowerCase();
    h += `<tr data-st="${esc(u.status)}" data-hay="${esc(hay)}" style="cursor:pointer" onclick="openUnitPanel('${esc(u.subId)}')">
      <td><strong>${esc(u.subId)}</strong><br><span style="font-size:12px;color:var(--muted)">${esc(u.name)}</span></td>
      <td>${stBadge(u.status)}</td><td style="font-size:13px">${esc(where)}</td><td>${daysTxt(u.daysInStatus)}</td></tr>`;
  });
  return h + '</table></div>';
}

function filterUnits() {
  const q  = (document.getElementById('unitSearch').value || '').toLowerCase().trim();
  const st = document.getElementById('unitStatus').value;
  document.querySelectorAll('#unitTable tr[data-st]').forEach(tr => {
    const ok = (!st || tr.dataset.st === st) && (!q || tr.dataset.hay.includes(q));
    tr.style.display = ok ? '' : 'none';
  });
}

// ═══════════════════════════════════════════════════
//  เมนู 2 — ชำรุด / ส่งซ่อม / สูญหาย
// ═══════════════════════════════════════════════════
let probFilter = '';

function renderProblem(d) {
  try {
    const bad = allUnits(d).filter(u => PROBLEM_ST.includes(u.status))
      .sort((a,b) => (b.daysInStatus||0) - (a.daysInStatus||0));
    const cnt = { damaged:0, repair:0, lost:0 };
    bad.forEach(u => cnt[u.status]++);
    const longest = bad.length ? Math.max.apply(null, bad.map(u => u.daysInStatus||0)) : 0;

    let h = `<h1 class="page-title">อุปกรณ์ชำรุด / ส่งซ่อม / สูญหาย</h1>
      <div class="page-sub">ติดตามอุปกรณ์ที่ใช้งานไม่ได้ — ตั้งแต่เมื่อไหร่ นานกี่วัน และอาการ/เหตุผล</div>
      <div class="kpi-row">
        ${kpiCard('problem','ชำรุด',cnt.damaged,C.red,'ชิ้น')}
        ${kpiCard('problem','ส่งซ่อม',cnt.repair,'#991B1B','ชิ้น')}
        ${kpiCard('problem','สูญหาย',cnt.lost,C.slate,'ชิ้น')}
        ${kpiCard('process','ค้างนานที่สุด',longest,longest>=7?C.red:C.ocean,'วัน')}
      </div>`;

    if (!bad.length) {
      h += `<div class="ok-strip">${statusIcon('available',22)}ไม่มีอุปกรณ์ชำรุด/ส่งซ่อม/สูญหายในขณะนี้</div>`;
      setContent('pane-problem', h); return;
    }

    const eqs = (d.equipment||[]).filter(eq => eq.units.some(u => PROBLEM_ST.includes(u.status)));
    const top = bad.slice(0, 10);
    h += `<div class="grid2">
      <div class="cc"><div class="cc-t">จำนวนแยกตามชนิดอุปกรณ์</div><div class="cc-s">ชิ้นที่ชำรุด/ส่งซ่อม/สูญหาย</div>
        ${chartBox('chProbByType',barH(eqs.length),'กราฟแท่งจำนวนอุปกรณ์ชำรุดแยกตามชนิด')}</div>
      <div class="cc"><div class="cc-t">ระยะเวลาที่ค้างสถานะ (วัน)</div><div class="cc-s">${bad.length>10?'10 อันดับแรก':'ทุกเครื่อง'} เรียงจากนานที่สุด</div>
        ${chartBox('chProbDays',barH(top.length),'กราฟแท่งจำนวนวันที่อุปกรณ์ค้างสถานะ')}</div>
    </div>`;

    h += '<div class="sec">รายการที่ต้องดำเนินการ</div><div class="chips" id="probChips">' +
      [['','ทั้งหมด ('+bad.length+')'],['damaged','ชำรุด ('+cnt.damaged+')'],['repair','ส่งซ่อม ('+cnt.repair+')'],['lost','สูญหาย ('+cnt.lost+')']]
        .map(([k,l]) => `<button class="chip${probFilter===k?' on':''}" onclick="setProbFilter('${k}')">${l}</button>`).join('') + '</div>';
    h += '<div class="tbl-wrap"><table id="probTable"><tr><th>เครื่อง</th><th>สถานะ</th><th>ตั้งแต่</th><th class="num">นาน</th><th>อาการ / เหตุผล</th><th>ที่อยู่</th></tr>';
    bad.forEach(u => {
      const long = (u.daysInStatus||0) >= 7;
      h += `<tr data-st="${esc(u.status)}" style="cursor:pointer" onclick="openUnitPanel('${esc(u.subId)}')">
        <td><strong>${esc(u.subId)}</strong><br><span style="font-size:12px;color:var(--muted)">${esc(u.name)}</span></td>
        <td>${stBadge(u.status)}</td><td>${fmtDay(u.since)}</td>
        <td class="num" style="font-weight:800;color:${long?'#B91C1C':'#92400E'}">${daysTxt(u.daysInStatus)}${long?' ⚠':''}</td>
        <td style="font-size:13px">${esc(u.note)||'<span style="color:#94A3B8">ไม่ระบุ</span>'}</td>
        <td style="font-size:13px">${esc(u.location||u.homeWard)}</td></tr>`;
    });
    h += '</table></div><div class="legend-note">⚠ = ค้างตั้งแต่ 7 วันขึ้นไป</div>';
    setContent('pane-problem', h);
    applyProbFilter();

    mkChart('chProbByType', {
      type:'bar',
      data:{ labels: eqs.map(e => e.equipmentName),
        datasets: PROBLEM_ST.filter(s => cnt[s] > 0).map(s => ({
          label: STATUS_TH[s], backgroundColor: PROBLEM_COLOR[s], borderColor:'#fff', borderWidth:2,
          data: eqs.map(e => e.units.filter(u => u.status === s).length) })) },
      options:{ indexAxis:'y',
        scales:{ x:{ stacked:true, ticks:{ precision:0, stepSize:1 }, grid:{ color:C.line } }, y:{ stacked:true, grid:{ display:false } } },
        plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12, padding:12 } } } }
    });
    mkChart('chProbDays', {
      type:'bar', plugins:[barValueLabels],
      data:{ labels: top.map(u => u.subId),
        datasets:[{ label:'วันที่ค้าง', data: top.map(u => u.daysInStatus||0),
          backgroundColor: top.map(u => PROBLEM_COLOR[u.status]), borderRadius:4, borderSkipped:'start', maxBarThickness:22 }] },
      options:{ indexAxis:'y', layout:{ padding:{ right:44 } },
        scales:{ x:{ beginAtZero:true, ticks:{ precision:0 }, grid:{ color:C.line } }, y:{ grid:{ display:false } } },
        plugins:{ legend:{ display:false }, barValueLabels:{ suffix:' วัน' },
          tooltip:{ callbacks:{ title: i => top[i[0].dataIndex].subId + ' — ' + top[i[0].dataIndex].name,
                                label: c => ` ${STATUS_TH[top[c.dataIndex].status]} · ${c.parsed.x} วัน` } } } }
    });
  } catch(err) {
    console.error('renderProblem error:', err);
    setContent('pane-problem', errHTML('Render error: ' + esc(err.message)));
  }
}

function setProbFilter(k) {
  probFilter = k;
  document.querySelectorAll('#probChips .chip').forEach((b,i) => b.classList.toggle('on', ['','damaged','repair','lost'][i] === k));
  applyProbFilter();
}
function applyProbFilter() {
  document.querySelectorAll('#probTable tr[data-st]').forEach(tr => {
    tr.style.display = (!probFilter || tr.dataset.st === probFilter) ? '' : 'none';
  });
}

// แผงรายละเอียด: สถานะปัจจุบัน + ที่อยู่ + timeline (v7: ดูได้ทุกคน ไม่ต้อง login)
async function openUnitPanel(subId) {
  const u = pubData ? allUnits(pubData).find(x => x.subId === subId) : null;
  let head = '';
  if (u) {
    head = `<div style="margin-bottom:10px">${stBadge(u.status)}
      <div style="font-size:14px;margin-top:6px;line-height:1.8">
      📍 ที่อยู่: <strong>${esc(u.location || u.homeWard || '-')}</strong><br>
      🕒 สถานะนี้ตั้งแต่: ${fmtDT(u.since)} (${daysTxt(u.daysInStatus)})<br>
      ${u.ward && u.status==='in_use' ? '🏢 หน่วยงานที่ยืม: ' + esc(u.ward) + '<br>' : ''}
      ${u.note ? '📝 อาการ/เหตุผล: ' + esc(u.note) + '<br>' : ''}</div></div>`;
  }
  showPanel(subId + (u ? ' — ' + u.name : ''), head + '<div id="unitHist">' + spinHTML() + '</div>');
  try {
    const r = await get('getEquipmentHistory', { subId });
    if (!r.success) throw new Error(r.error);
    const d = r.data, st = d.stats;
    let h = `<div class="kpi-row" style="margin-bottom:10px">
      <div class="kpi"><div class="kpi-val" style="font-size:32px;color:${C.ocean}">${st.borrowCount}</div><div class="kpi-lbl">ครั้งที่ถูกยืม</div></div>
      <div class="kpi"><div class="kpi-val" style="font-size:32px;color:${C.red}">${st.damageCount}</div><div class="kpi-lbl">ครั้งที่ชำรุด</div></div>
      <div class="kpi"><div class="kpi-val" style="font-size:32px;color:${C.slate}">${st.downDays}</div><div class="kpi-lbl">วันที่หยุดใช้งาน</div></div></div>
      <div class="sec" style="margin-top:4px;font-size:16px">ประวัติสถานะ (ใหม่ → เก่า)</div>`;
    if (!d.events.length) h += emptyHTML('📋', 'ยังไม่มีประวัติ');
    d.events.forEach(ev => {
      h += `<div style="border-left:3px solid ${PROBLEM_ST.includes(ev.to)?C.red:C.ocean};padding:4px 0 8px 10px;margin-left:4px">
        <div style="font-size:12px;color:#64748B">${fmtDT(ev.time)}</div>
        <div>${ev.from ? stBadge(ev.from) + ' → ' : ''}${stBadge(ev.to)}</div>
        <div style="font-size:12px;color:#475569">${ev.by ? '👤 ' + esc(ev.by) : ''}${ev.location ? ' · 📍 ' + esc(ev.location) : ''}</div>
        ${ev.reason ? `<div style="font-size:13px">📝 ${esc(ev.reason)}</div>` : ''}</div>`;
    });
    if (!userAuth) h += '<div style="font-size:12px;color:#94A3B8;text-align:center;padding:10px">ชื่อผู้ดำเนินการแสดงเฉพาะเจ้าหน้าที่ที่เข้าสู่ระบบ</div>';
    document.getElementById('unitHist').innerHTML = h;
  } catch(e) { document.getElementById('unitHist').innerHTML = errHTML(esc(e.message)); }
}

// ═══════════════════════════════════════════════════
//  เมนู 3 — การใช้งานอุปกรณ์ (ตัวกรอง เดือน/ปี/ช่วงเวลา · ชนิด · หน่วยงาน)
// ═══════════════════════════════════════════════════
const U = { mode:'month', month:'', year:0, from:'', to:'', type:'', ward:'', ready:false };

function initUsage() {
  if (U.ready) return;
  const ev  = usageData.events || [];
  const last = ev.length ? new Date(ev[ev.length-1].t) : new Date();   // เริ่มที่เดือนล่าสุดที่มีข้อมูล
  U.month = last.getFullYear() + '-' + String(last.getMonth()+1).padStart(2,'0');
  U.year  = last.getFullYear();
  U.to    = isoDate(last);
  U.from  = isoDate(new Date(last.getTime() - 29*86400000));
  U.ready = true;
}

function usageYears() {
  const ev = usageData.events || [], ys = {};
  ev.forEach(e => ys[new Date(e.t).getFullYear()] = 1);
  ys[U.year] = 1; ys[new Date().getFullYear()] = 1;
  return Object.keys(ys).map(Number).sort((a,b) => b-a);
}

function renderUsage() {
  const ev = usageData.events || [];
  const types = (pubData.equipment||[]).map(e => ({ id:e.equipmentId, name:e.equipmentName }));
  const wards = Array.from(new Set(ev.map(e => e.ward))).sort((a,b) => a.localeCompare(b,'th'));
  const opt = (v,l,sel) => `<option value="${esc(v)}"${sel?' selected':''}>${esc(l)}</option>`;

  let h = `<h1 class="page-title">การใช้งานอุปกรณ์</h1>
    <div class="page-sub">ติดตามอัตราการใช้งาน ดูว่าหน่วยงานใดใช้อุปกรณ์ชนิดใด และจำนวนเท่าไร</div>
    <div class="fbar">
      <div class="fgrp"><label>ช่วงเวลา</label>
        <div class="seg" id="uSeg">
          <button class="${U.mode==='month'?'on':''}" onclick="setUsageMode('month')">รายเดือน</button>
          <button class="${U.mode==='year'?'on':''}"  onclick="setUsageMode('year')">รายปี</button>
          <button class="${U.mode==='range'?'on':''}" onclick="setUsageMode('range')">กำหนดเอง</button>
        </div></div>
      <div class="fgrp" id="uMonthG" ${U.mode==='month'?'':'style="display:none"'}><label>เดือน</label>
        <input type="month" id="uMonth" value="${U.month}" onchange="U.month=this.value;updateUsage()"></div>
      <div class="fgrp" id="uYearG" ${U.mode==='year'?'':'style="display:none"'}><label>ปี (พ.ศ.)</label>
        <select id="uYear" onchange="U.year=+this.value;updateUsage()">${usageYears().map(y => opt(y, y+543, y===U.year)).join('')}</select></div>
      <div class="fgrp" id="uFromG" ${U.mode==='range'?'':'style="display:none"'}><label>ตั้งแต่</label>
        <input type="date" id="uFrom" value="${U.from}" onchange="U.from=this.value;updateUsage()"></div>
      <div class="fgrp" id="uToG" ${U.mode==='range'?'':'style="display:none"'}><label>ถึง</label>
        <input type="date" id="uTo" value="${U.to}" onchange="U.to=this.value;updateUsage()"></div>
      <div class="fgrp" style="flex:1"><label>ชนิดอุปกรณ์</label>
        <select id="uType" onchange="U.type=this.value;updateUsage()">${opt('','ทุกชนิด',!U.type)}${types.map(t => opt(t.id,t.name,t.id===U.type)).join('')}</select></div>
      <div class="fgrp" style="flex:1"><label>หน่วยงาน</label>
        <select id="uWard" onchange="U.ward=this.value;updateUsage()">${opt('','ทุกหน่วยงาน',!U.ward)}${wards.map(w => opt(w,w,w===U.ward)).join('')}</select></div>
    </div>
    <div id="uResult"></div>
    <div style="font-size:12px;color:#94A3B8;text-align:center;margin-top:14px">อัปเดต: ${fmtTime(usageData.lastUpdated)} · ไม่แสดงชื่อ/เบอร์ผู้ยืม</div>`;
  setContent('pane-usage', h);
  updateUsage();
}

function setUsageMode(m) {
  U.mode = m;
  document.querySelectorAll('#uSeg button').forEach((b,i) => b.classList.toggle('on', ['month','year','range'][i] === m));
  const vis = { uMonthG:m==='month', uYearG:m==='year', uFromG:m==='range', uToG:m==='range' };
  Object.keys(vis).forEach(id => document.getElementById(id).style.display = vis[id] ? '' : 'none');
  updateUsage();
}

function usageRange() {
  if (U.mode === 'month') { const p = U.month.split('-').map(Number); return [new Date(p[0],p[1]-1,1), new Date(p[0],p[1],0,23,59,59,999)]; }
  if (U.mode === 'year')  return [new Date(U.year,0,1), new Date(U.year,11,31,23,59,59,999)];
  return [new Date(U.from+'T00:00:00'), new Date(U.to+'T23:59:59.999')];
}

function computeUsage() {
  const range = usageRange(), from = range[0], to = range[1], now = new Date();
  const ev = usageData.events || [];
  const typeOk = e => !U.type || e.equipmentId === U.type;
  const wardOk = e => !U.ward || e.ward === U.ward;

  // นับจำนวนครั้งที่ยืมในช่วงเวลา
  const byWard = {}, byType = {}, matrix = {}, typeName = {};
  let borrows = 0;
  const monthly = U.mode === 'year' || (U.mode === 'range' && (to - from) / 86400000 > 62);
  const buckets = [], bIndex = {};
  const cur = new Date(from.getFullYear(), from.getMonth(), monthly ? 1 : from.getDate());
  while (cur <= to && buckets.length < 400) {
    const key = monthly ? cur.getFullYear()*100 + cur.getMonth() : isoDate(cur);
    bIndex[key] = buckets.length;
    buckets.push({ label: monthly ? MONTH_TH[cur.getMonth()] : (U.mode==='month' ? String(cur.getDate()) : cur.getDate()+' '+MONTH_TH[cur.getMonth()]), n:0 });
    if (monthly) cur.setMonth(cur.getMonth()+1); else cur.setDate(cur.getDate()+1);
  }
  ev.forEach(e => {
    typeName[e.equipmentId] = e.equipmentName;
    if (e.type !== 'borrow' || !typeOk(e) || !wardOk(e)) return;
    const d = new Date(e.t);
    if (d < from || d > to) return;
    borrows++;
    byWard[e.ward] = (byWard[e.ward]||0) + 1;
    byType[e.equipmentId] = (byType[e.equipmentId]||0) + 1;
    (matrix[e.ward] = matrix[e.ward] || {})[e.equipmentId] = ((matrix[e.ward]||{})[e.equipmentId]||0) + 1;
    const k = monthly ? d.getFullYear()*100 + d.getMonth() : isoDate(d);
    if (bIndex[k] != null) buckets[bIndex[k]].n++;
  });

  // วันใช้งาน (device-days): จับคู่ ยืม → คืน ต่อเครื่อง แล้วตัดให้อยู่ในช่วงเวลา
  const open = {}, daysByType = {};
  let useDays = 0;
  const endClip = Math.min(to.getTime(), now.getTime());
  const addInterval = (b, endMs) => {
    if (!typeOk(b) || !wardOk(b)) return;
    const s = Math.max(new Date(b.t).getTime(), from.getTime()), e2 = Math.min(endMs, endClip);
    if (e2 <= s) return;
    const dd = (e2 - s) / 86400000;
    useDays += dd; daysByType[b.equipmentId] = (daysByType[b.equipmentId]||0) + dd;
  };
  ev.forEach(e => {
    if (e.type === 'borrow') { if (open[e.subId]) addInterval(open[e.subId], new Date(e.t).getTime()); open[e.subId] = e; }
    else if (open[e.subId]) { addInterval(open[e.subId], new Date(e.t).getTime()); delete open[e.subId]; }
  });
  Object.keys(open).forEach(k => addInterval(open[k], now.getTime()));

  const rangeDays = Math.max(0, (endClip - from.getTime()) / 86400000);
  const unitsByType = {};
  allUnits(pubData).forEach(u => unitsByType[u.equipmentId] = (unitsByType[u.equipmentId]||0) + 1);
  const selTypes = U.type ? [U.type] : Object.keys(unitsByType);
  const unitTotal = selTypes.reduce((a,t) => a + (unitsByType[t]||0), 0);
  const util = (days, units) => (units > 0 && rangeDays > 0) ? Math.min(100, days / (units * rangeDays) * 100) : 0;
  const utilByType = selTypes.map(t => ({ id:t, name:(pubData.equipment.find(e => e.equipmentId===t)||{}).equipmentName || typeName[t] || t,
    pct: Math.round(util(daysByType[t]||0, unitsByType[t]||0)*10)/10, days: Math.round((daysByType[t]||0)*10)/10, units: unitsByType[t]||0 }));

  return { from, to, monthly, buckets, borrows, byWard, byType, matrix, typeName,
    useDays: Math.round(useDays*10)/10, rangeDays, unitTotal, utilPct: Math.round(util(useDays, unitTotal)*10)/10, utilByType,
    wardCount: Object.keys(byWard).length };
}

function updateUsage() {
  const el = document.getElementById('uResult');
  if (!el) return;
  const r = computeUsage();
  const rangeTxt = r.from.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'}) + ' – ' +
                   r.to.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
  const typeLbl = U.type ? (r.utilByType[0] ? r.utilByType[0].name : '') : 'ทุกชนิด';

  let h = `<div class="kpi-row">
    ${kpiCard('in_use','ครั้งที่ถูกยืม',r.borrows,C.ocean,esc(rangeTxt))}
    ${kpiCard('process','หน่วยงานที่ใช้',r.wardCount,C.ocean,'หน่วยงาน')}
    ${kpiCard('available','วันใช้งานรวม',r.useDays.toLocaleString('th-TH'),C.teal,'เครื่อง·วัน')}
    ${kpiCard('in_use','อัตราการใช้งาน',r.utilPct+'<span style="font-size:20px">%</span>','#B45309','จาก '+r.unitTotal+' เครื่อง · '+esc(typeLbl))}
  </div>`;

  if (!r.borrows && !r.useDays) {
    h += emptyHTML('📭','ไม่มีข้อมูลการใช้งานในช่วงที่เลือก — ลองเปลี่ยนช่วงเวลา ชนิดอุปกรณ์ หรือหน่วยงาน');
    el.innerHTML = h; return;

  const wardRows = Object.keys(r.byWard).map(w => [w, r.byWard[w]]).sort((a,b) => b[1]-a[1]);
  const topW = wardRows.slice(0, 10);
  if (wardRows.length > 10) topW.push(['อื่นๆ ('+(wardRows.length-10)+' หน่วยงาน)', wardRows.slice(10).reduce((a,x) => a+x[1], 0)]);

  h += `<div class="cc" style="margin-bottom:12px"><div class="cc-t">จำนวนครั้งที่ยืมตามช่วงเวลา</div>
    <div class="cc-s">${r.monthly?'รายเดือน':'รายวัน'} · ${esc(typeLbl)}${U.ward?' · '+esc(U.ward):''}</div>
    ${chartBox('chUsageTrend',240,'กราฟแท่งจำนวนครั้งที่ยืมตามช่วงเวลา')}</div>
  <div class="grid2">
    <div class="cc"><div class="cc-t">หน่วยงานที่ใช้งาน</div><div class="cc-s">จำนวนครั้งที่ยืม เรียงจากมากไปน้อย</div>
      ${chartBox('chUsageWard',barH(topW.length),'กราฟแท่งจำนวนครั้งที่ยืมแยกตามหน่วยงาน')}</div>
    <div class="cc"><div class="cc-t">อัตราการใช้งานแยกตามชนิด</div><div class="cc-s">% ของเวลาที่อุปกรณ์ถูกใช้งาน (วันใช้งาน ÷ จำนวนเครื่อง × จำนวนวัน)</div>
      ${chartBox('chUsageUtil',barH(r.utilByType.length),'กราฟแท่งอัตราการใช้งานแยกตามชนิดอุปกรณ์')}</div>
  </div>`;

  // ตาราง หน่วยงาน × ชนิดอุปกรณ์
  const tIds = Object.keys(r.byType).sort((a,b) => r.byType[b]-r.byType[a]);
  h += '<div class="sec">ตารางการใช้งาน หน่วยงาน × ชนิดอุปกรณ์</div><div class="tbl-wrap"><table><tr><th>หน่วยงาน</th>' +
    tIds.map(t => `<th class="num">${esc(r.typeName[t]||t)}</th>`).join('') + '<th class="num">รวม</th></tr>';
  wardRows.forEach(([w, tot]) => {
    h += `<tr><td><strong>${esc(w)}</strong></td>` +
      tIds.map(t => `<td class="num">${(r.matrix[w]||{})[t] || '<span style="color:#CBD5E1">–</span>'}</td>`).join('') +
      `<td class="num"><strong>${tot}</strong></td></tr>`;
  });
  h += '<tfoot><tr><td>รวมทั้งหมด</td>' + tIds.map(t => `<td class="num">${r.byType[t]}</td>`).join('') +
    `<td class="num">${r.borrows}</td></tr></tfoot></table></div>`;
  el.innerHTML = h;

  mkChart('chUsageTrend', {
    type:'bar',
    data:{ labels: r.buckets.map(b => b.label),
      datasets:[{ label:'ครั้งที่ยืม', data: r.buckets.map(b => b.n), backgroundColor:C.ocean, borderRadius:4, borderSkipped:'bottom', maxBarThickness:28 }] },
    options:{ scales:{ y:{ beginAtZero:true, ticks:{ precision:0 }, grid:{ color:C.line } }, x:{ grid:{ display:false }, ticks:{ maxRotation:0, autoSkip:true, maxTicksLimit:16 } } },
      plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label: c => ` ${c.parsed.y} ครั้ง` } } } }
  });
  mkChart('chUsageWard', {
    type:'bar', plugins:[barValueLabels],
    data:{ labels: topW.map(x => x[0]),
      datasets:[{ label:'ครั้งที่ยืม', data: topW.map(x => x[1]), backgroundColor:C.ocean, borderRadius:4, borderSkipped:'start', maxBarThickness:22 }] },
    options:{ indexAxis:'y', layout:{ padding:{ right:36 } },
      scales:{ x:{ beginAtZero:true, ticks:{ precision:0 }, grid:{ color:C.line } }, y:{ grid:{ display:false } } },
      plugins:{ legend:{ display:false }, barValueLabels:{ suffix:'' }, tooltip:{ callbacks:{ label: c => ` ${c.parsed.x} ครั้ง` } } } }
  });
  mkChart('chUsageUtil', {
    type:'bar', plugins:[barValueLabels],
    data:{ labels: r.utilByType.map(t => t.name),
      datasets:[{ label:'อัตราการใช้งาน', data: r.utilByType.map(t => t.pct), backgroundColor:C.air, borderRadius:4, borderSkipped:'start', maxBarThickness:22 }] },
    options:{ indexAxis:'y', layout:{ padding:{ right:44 } },
      scales:{ x:{ beginAtZero:true, max:100, ticks:{ callback: v => v+'%' }, grid:{ color:C.line } }, y:{ grid:{ display:false } } },
      plugins:{ legend:{ display:false }, barValueLabels:{ suffix:'%' },
        tooltip:{ callbacks:{ label: c => { const t = r.utilByType[c.dataIndex]; return ` ${t.pct}% · ใช้งาน ${t.days} เครื่อง·วัน จาก ${t.units} เครื่อง`; } } } } }
  });
}

function switchAdmTab(tab) {
  curAdmTab = tab;
  document.querySelectorAll('.adm-tab').forEach(el=>el.style.display='none');
  const el = document.getElementById('adm-'+tab);
  if (el) el.style.display = 'block';
  if (tab==='report') return; // report loads manually
  loadAdmTab(tab);
}

async function loadAdmTab(tab) {
  const el = document.getElementById('adm-'+tab);
  if (!el) return;

  if (tab==='status') {
    // ดึงทุกสถานะ
    el.innerHTML = spinHTML();
    try {
      const r = await post({ source:'admin', action:'getEquipmentByStatus', userId, status:'' });
      renderAdmStatus(r.data||[], el);
    } catch(e) { el.innerHTML = errHTML(e.message); }
    return;
  }

  // รายการอื่นใช้ admData
  if (!admData) {
    el.innerHTML = spinHTML();
    try {
      const r = await post({ source:'dashboard', action:'getDashboardAdmin', userId, fromDate:'', toDate:'' });
      if (!r.success) throw new Error(r.error);
      admData = r.data;
    } catch(e) { el.innerHTML = errHTML(e.message); return; }
  }
  renderAdmTab(tab, el, admData);
}

}

async function doApprove(requestId) {
  if (!confirm('อนุมัติคำร้อง '+requestId+'?')) return;
  const r = await post({ source:'admin', action:'approve', userId, requestId, notes:'' });
  if (r.success) { admData=null; showSuccess('✅','อนุมัติสำเร็จ','คำร้อง '+requestId); switchAdmTab('pending'); }
  else alert('⚠️ '+r.error);
}

async function doReject(requestId, subId) {
  const notes = prompt('เหตุผลที่ปฏิเสธ (ถ้ามี):') || '';
  const r = await post({ source:'admin', action:'reject', userId, requestId, notes });
  if (r.success) { admData=null; showSuccess('❌','ปฏิเสธแล้ว',subId+' · '+requestId); switchAdmTab('pending'); }
  else alert('⚠️ '+r.error);
}

function setRange(days) {
  const to = new Date(), from = new Date(Date.now()-days*86400000);
  document.getElementById('rptFrom').value = isoDate(from);
  document.getElementById('rptTo').value   = isoDate(to);
}

async function loadReport() {
  const from = document.getElementById('rptFrom').value;
  const to   = document.getElementById('rptTo').value;
  setContent('rpt-content', spinHTML());
  try {
    const r = await post({ source:'dashboard', action:'getDashboardAdmin', userId, fromDate:from, toDate:to });
    if (!r.success) throw new Error(r.error);
    const d = r.data;
    const txns = d.transactions||[];
    let borrow=0, ret=0;
    txns.forEach(t=>{ if(t.type==='borrow') borrow++; else ret++; });
    let h = `<div class="kpi-row">
      <div class="kpi"><div class="kpi-icon">📋</div><div class="kpi-val" style="color:#0C4A6E">${txns.length}</div><div class="kpi-lbl">รายการทั้งหมด</div></div>
      <div class="kpi"><div class="kpi-icon">📤</div><div class="kpi-val" style="color:#3B82F6">${borrow}</div><div class="kpi-lbl">ยืม</div></div>
      <div class="kpi"><div class="kpi-icon">📥</div><div class="kpi-val" style="color:#22C55E">${ret}</div><div class="kpi-lbl">คืน</div></div>
      <div class="kpi"><div class="kpi-icon">🚨</div><div class="kpi-val" style="color:#EF4444">${(d.kpi||{}).overdueCount||0}</div><div class="kpi-lbl">เกินกำหนด</div></div>
    </div>`;
    h += '<div class="sec">รายการธุรกรรม</div>';
    if (!txns.length) { h += emptyHTML('📋','ไม่มีข้อมูลในช่วงที่เลือก'); }
    else {
      h += '<div class="tbl-wrap"><table><tr><th>วันที่</th><th>ประเภท</th><th>อุปกรณ์</th><th>ผู้ยืม</th><th>Ward</th><th>สภาพ</th></tr>';
      txns.forEach(t=>{
        h += `<tr><td style="white-space:nowrap">${t.timestamp}</td>
          <td><span class="badge ${t.type==='borrow'?'in_use':'approved'}">${t.type==='borrow'?'ยืม':'คืน'}</span></td>
          <td>${t.equipmentSubId}</td><td>${t.borrowerName}</td><td>${t.ward}</td><td>${t.condition||'-'}</td></tr>`;
      });
      h += '</table></div>';
    }
    setContent('rpt-content', h);
  } catch(e) { setContent('rpt-content', errHTML(e.message)); }
}

function printReport() { window.print(); }

function switchCenTab(tab) {
  curCenTab = tab;
  document.querySelectorAll('.cen-tab').forEach(el=>el.style.display='none');
  const el = document.getElementById('cen-'+tab);
  if (el) el.style.display = 'block';
  if (tab==='report') { loadCenReport(); return; }
  loadCenTab(tab);
}

async function loadCenTab(tab) {
  if (!cenData) {
    const el = document.getElementById('cen-'+tab);
    if (el) el.innerHTML = spinHTML();
    try {
      const r = await post({ source:'central', action:'getCentralPipeline', userId });
      if (!r.success) throw new Error(r.error);
      cenData = r.data;
    } catch(e) {
      const el2 = document.getElementById('cen-'+tab);
      if (el2) el2.innerHTML = errHTML(e.message);
      return;
    }
  }
  renderCenTab(tab);
}

function renderCenTab(tab) {
  const el  = document.getElementById('cen-'+tab);
  if (!el || !cenData) return;

  if (tab==='receive') {
    const items = cenData.toReceive||[];
    let h = '<div class="sec">รออุปกรณ์จากวอร์ด ('+items.length+')</div>';
    if (!items.length) { h += emptyHTML('📭','ไม่มีอุปกรณ์รอรับ'); }
    else items.forEach(eq=>{
      const s = eq.steril||{};
      h += `<div class="card" style="cursor:pointer" onclick="openCenReceivePanel('${eq.equipmentSubId}','${eq.equipmentName}','${eq.homeWard}')">
        <div class="card-hd">
          <div class="card-title">📦 ${eq.equipmentSubId} — ${eq.equipmentName}</div>
          <span class="badge pending_sterilization">รอรับ</span>
        </div>
        <div class="card-body">
          <div class="ir"><span class="ir-l">🏥 จากวอร์ด</span><span class="ir-v">${eq.homeWard}</span></div>
          <div class="ir"><span class="ir-l">👤 ส่งโดย</span><span class="ir-v">${s.sentBy||'-'}</span></div>
          <div class="ir"><span class="ir-l">⏰ เวลาส่ง</span><span class="ir-v">${s.sentTime||'-'}</span></div>
          <div style="font-size:13px;color:#0369A1;font-weight:700;margin-top:8px">แตะเพื่อยืนยันรับ →</div>
        </div>
      </div>`;
    });
    el.innerHTML = h;
  }

  if (tab==='return') {
    const acItems = cenData.atCentral||[];
    let h = '<div class="sec">กำลังฆ่าเชื้อ ('+acItems.length+')</div>';
    if (!acItems.length) { h += emptyHTML('🧪','ไม่มีอุปกรณ์กำลังฆ่าเชื้อ'); }
    else acItems.forEach(eq=>{
      const s = eq.steril||{};
      h += `<div class="card">
        <div class="card-hd">
          <div class="card-title">🧪 ${eq.equipmentSubId} — ${eq.equipmentName}</div>
          <span class="badge at_central">กำลังฆ่าเชื้อ</span>
        </div>
        <div class="card-body">
          <div class="ir"><span class="ir-l">🏥 ส่งคืนที่</span><span class="ir-v">${eq.homeWard}</span></div>
          <div class="ir"><span class="ir-l">👤 ลงชื่อรับโดย</span><span class="ir-v">${s.centralReceivedBy||'-'}</span></div>
          <div class="ir"><span class="ir-l">⏰ เวลารับมอบ</span><span class="ir-v">${s.centralReceivedTime||'-'}</span></div>
          <div style="font-size:12px;color:#64748B;margin-top:6px">⏳ รอ Admin กด "รับกลับ" เมื่อจ่ายกลางส่งคืนแล้ว</div>
        </div>
      </div>`;
    });
    el.innerHTML = h;
  }
}

async function loadSuperView() {
  setContent('sup-content', spinHTML());
  try {
    const r = await post({ source:'dashboard', action:'getDashboardFull', userId, fromDate:'', toDate:'' });
    if (!r.success) throw new Error(r.error);
    const d = r.data;
    const sc = d.statusSummary||{};
    let h = `<div class="kpi-row">
      <div class="kpi"><div class="kpi-icon">📦</div><div class="kpi-val" style="color:#0C4A6E">${d.totalUnits||0}</div><div class="kpi-lbl">ชิ้นทั้งหมด</div></div>
      <div class="kpi"><div class="kpi-icon">✅</div><div class="kpi-val" style="color:#22C55E">${sc.available||0}</div><div class="kpi-lbl">ว่าง</div></div>
      <div class="kpi"><div class="kpi-icon">📋</div><div class="kpi-val" style="color:#3B82F6">${sc.in_use||0}</div><div class="kpi-lbl">กำลังยืม</div></div>
      <div class="kpi"><div class="kpi-icon">📈</div><div class="kpi-val" style="color:#8B5CF6">${d.utilRate||0}%</div><div class="kpi-lbl">Utilization</div></div>
    </div>`;
    h += '<div class="sec">สถิติแยก Ward</div><div class="tbl-wrap"><table><tr><th>Ward</th><th>ทั้งหมด</th><th>ว่าง</th><th>ยืม</th><th>Util%</th></tr>';
    Object.entries(d.wardSummary||{}).forEach(([ward,ws])=>{
      const util = ws.total>0 ? Math.round(ws.inUse/ws.total*100) : 0;
      h += `<tr><td>${ward}</td><td>${ws.total}</td><td>${ws.available}</td><td>${ws.inUse}</td><td>${util}%</td></tr>`;
    });
    h += '</table></div>';
    setContent('sup-content', h);
  } catch(e) { setContent('sup-content', errHTML(e.message)); }
}

// ═══════════════════════════════════════════════════
//  PANEL HELPERS
// ═══════════════════════════════════════════════════
function showPanel(title, bodyHtml) {
  document.getElementById('panelTitle').textContent = title;
  document.getElementById('panelBody').innerHTML    = bodyHtml;
  document.getElementById('detailPanel').style.display = 'block';
  document.getElementById('panelBg').classList.add('show');
}

function closePanel() {
  document.getElementById('detailPanel').style.display = 'none';
  document.getElementById('panelBg').classList.remove('show');
}

function showSuccess(icon, title, sub) {
  document.getElementById('successIcon').textContent  = icon;
  document.getElementById('successTitle').textContent = title;
  document.getElementById('successSub').textContent   = sub;
  document.getElementById('successOv').classList.add('show');
}

function hideSuccess() { document.getElementById('successOv').classList.remove('show'); }

function showErr(id, msg) {
  const el = document.getElementById(id);
  if (el) { el.textContent='⚠️ '+msg; el.classList.add('show'); }
}

function setBtnLoading(id, loading) {
  const el = document.getElementById(id);
  if (el) { el.disabled=loading; el.textContent=loading?'⏳ กำลังบันทึก...':el.textContent; }
}

// ═══════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════
function show(id)  { const e=document.getElementById(id); if(!e) return; e.style.display = e.classList.contains('view') ? 'block' : ''; }
function hide(id)  { const e=document.getElementById(id); if(e) e.style.display='none'; }
function setContent(id, html) { const e=document.getElementById(id); if(e) e.innerHTML=html; }
function spinHTML() { return '<div class="spin-box"><div class="spinner"></div>กำลังโหลด...</div>'; }
function errHTML(msg) { return `<div class="empty"><div class="icon">⚠️</div>${msg}</div>`; }
function emptyHTML(icon, msg) { return `<div class="empty"><div class="icon">${icon}</div>${msg}</div>`; }
function isoDate(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtTime(iso) { try { return new Date(iso).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); } catch(e){ return '-'; } }
</script>

document.addEventListener('DOMContentLoaded', function() {
  // init p-cond dropdowns (ทั้ง 2 wrappers)
  ['cdd_pcond_wrap1','cdd_pcond_wrap2'].forEach(function(wid) {
    var w = document.getElementById(wid);
    if (w) w.appendChild(makeCDD('p-cond', [{value:'สภาพพร้อมใช้งาน (Ready for use)',label:'พร้อมใช้งาน'},{value:'ชำรุดเล็กน้อย (Minor damage)',label:'ชำรุดเล็กน้อย'},{value:'ชำรุดมาก/ใช้งานไม่ได้ (Major damage/Unusable)',label:'ชำรุดมาก'}], '— เลือก —', function(v){ if(typeof checkCond==='function') checkCond(); }));
  });
  // p-status
  var ws = document.getElementById('cdd_pstatus_wrap');
  if (ws) ws.appendChild(makeCDD('p-status', [{value:'available',label:'✅ พร้อมใช้งาน'},{value:'damaged',label:'🔴 ชำรุด'},{value:'repair',label:'🔧 ส่งซ่อม'},{value:'disposed',label:'🗑️ จำหน่าย (ถาวร)'},{value:'lost',label:'❓ สูญหาย (ถาวร)'}], '— เลือก —', null));
});
</script>
</body>
</html>
